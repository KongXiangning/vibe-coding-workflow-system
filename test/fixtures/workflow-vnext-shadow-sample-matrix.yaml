    lifecycleTuple: null
    diffTarget:
      kind: patch
      description: fixture patch
      base: fixture-base
      head: null
      fingerprint: diff-default
    goalAndClaims: [C1]
    scope:
      allowed: [src/**]
      conditional: []
      forbidden: [.git/**, node_modules/**]
      conditionalAuthorizations: []
    changedPaths: [src/example.ts]
    changedSymbols: [value]
    changedSurfaces: [typescript-module]
    riskTriggers: []
    evidence:
      - id: E1
        kind: test
        claimIds: [C1]
        status: passed
        locator: test/example.test.ts
        persistent: true
        ownerSource: acceptance
    observations: []
    convergence:
