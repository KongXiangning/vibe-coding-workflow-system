schemaVersion: 1
fixtureRevision: phase1-sample-matrix-v1
sourceTuple: workflow-vnext-phase1-read-only-v1

# No axes are declared in this source-repository contract fixture.  It is
# intentionally useful for structural/regression checks only; contract-fixture
# captures can never become promotion evidence.
requiredScenarios:
  - small-clean
  - checkpoint-continuity
  - mechanical-finding
  - scope-blocker
  - contract-product-decision
  - api-dto-propagation
