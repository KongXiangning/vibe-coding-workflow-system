schema_version: 1

cases:
  - id: MR-K01
    kind: row
    invariant: "Only confirmed unrelated work may create one inbox artifact; active task and lifecycle state remain unchanged."
    capability_refs: [public:capture-work-item/capture-only, internal:record-only-intake-guard, internal:owner-route-resolver, internal:scope-guard, runtime:inbox-record-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: not-applicable, evidence: [relation-unrelated, duplicate-check-clear, active-owner-recorded] }
    invocation: { entry: capture-work-item, mode: capture-only, legacy_alias: capture-work-item }
    expected: { guard: allow, verdict: "Create exactly one inbox record without changing CURRENT_TASK or lifecycle ownership.", writes: ["TASKS/inbox/INBOX-<timestamp>-<slug>.md"], handoff: not-applicable, terminal_behavior: manual-decision, diff_target: not-applicable, evidence: [single-inbox-artifact, current-task-unchanged, lifecycle-unchanged] }

  - id: MR-K02
    kind: row
    invariant: "Implementation is the only primary code-writing route and must block before mutation when scope, dangerous-operation, or current-doc gates fail."
    capability_refs: [public:execute-step/implement, internal:scope-guard, internal:dangerous-operation-gate, internal:decision-authority-gate, internal:design-evidence-gate, internal:external-documentation-gate, runtime:task-state-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: working-tree, evidence: [current-step-selected, forbidden-path-requested] }
    invocation: { entry: execute-step, mode: implement, legacy_alias: implement-current-step }
    expected: { guard: block, verdict: "A Forbidden path blocks before code or governance mutation.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [scope-violation-recorded, zero-mutation] }

  - id: MR-K03
    kind: row
    invariant: "Root-cause investigation remains report-only until reproduced evidence converges and stops after three non-converging hypotheses."
    capability_refs: [public:debug-task/investigate, internal:root-cause-loop, internal:owner-route-resolver, internal:source-authority-policy, internal:external-documentation-gate, runtime:task-state-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..checkpoint, evidence: [reproduction-recorded, three-hypotheses-rejected] }
    invocation: { entry: debug-task, mode: investigate, legacy_alias: investigate-root-cause }
    expected: { guard: block, verdict: "Stop investigation without repair authorization after the third non-converging attempt.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [attempt-count-three, no-repair-mutation] }

  - id: MR-K04
    kind: row
    invariant: "Realignment classifies ownership before mutation and never overwrites frozen, conflicting, native, or user-owned assets."
    capability_refs: [public:bootstrap-project/realign, internal:source-authority-policy, internal:host-isolation-guard, internal:scope-guard, internal:dangerous-operation-gate]
    initial_state: { task_status: not-applicable, lifecycle_state: not-applicable, diff_target: not-applicable, evidence: [mixed-workflow-and-native-assets, frozen-target-detected] }
    invocation: { entry: bootstrap-project, mode: realign, legacy_alias: realign-workflow-assets }
    expected: { guard: block, verdict: "Return a conflict plan and stop before touching the frozen target or unrelated host assets.", writes: [], handoff: not-applicable, terminal_behavior: manual-decision, diff_target: not-applicable, evidence: [ownership-classification, frozen-conflict, zero-mutation] }

  - id: MR-K05
    kind: row
    invariant: "Regression uses the shared diff target, preserves owner-aware routing, and never silently fixes a failed check."
    capability_refs: [public:validate-change/regression, internal:validation-layer-gate, internal:diff-target-resolver, internal:owner-route-resolver, internal:release-evidence-gate]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..checkpoint, evidence: [qa-mode-normal, test-failure-observed] }
    invocation: { entry: validate-change, mode: regression, legacy_alias: run-regression }
    expected: { guard: allow, verdict: "Report the failure against the recorded range and route to root-cause investigation without fixing it.", writes: [], handoff: debug-task:investigate, terminal_behavior: continue, diff_target: preserve, evidence: [failed-check-output, owning-layer, no-repair-mutation] }

  - id: MR-M01
    kind: row
    invariant: "Adoption promotes only confirmed facts and never converts conflicting or unknown evidence into a locked contract."
    capability_refs: [public:bootstrap-project/adopt, internal:source-authority-policy, internal:propagation-evidence-validator, internal:decision-authority-gate]
    initial_state: { task_status: not-applicable, lifecycle_state: not-applicable, diff_target: not-applicable, evidence: [unknown-consumer, conflicting-interface-evidence] }
    invocation: { entry: bootstrap-project, mode: adopt, legacy_alias: adopt-existing-project }
    expected: { guard: ask-user, verdict: "Keep the consumer unknown and stop for confirmation; do not lock a contract or edit feature code.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: not-applicable, evidence: [unknown-provenance-retained, conflict-surfaced, code-unchanged] }

  - id: MR-M02
    kind: row
    invariant: "Lesson capture is a no-op when an observation is one-off, unevidenced, or already represented."
    capability_refs: [public:sync-state/lessons, internal:source-authority-policy, internal:closure-eligibility-gate, runtime:lesson-record-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: not-applicable, evidence: [one-off-observation, no-reusable-trigger] }
    invocation: { entry: sync-state, mode: lessons, legacy_alias: capture-lessons }
    expected: { guard: no-op, verdict: "Do not create an empty slogan or duplicate lesson.", writes: [], handoff: not-applicable, terminal_behavior: complete, diff_target: not-applicable, evidence: [no-op-reason] }

  - id: MR-M03
    kind: row
    invariant: "Closure remains ordered and auditable; any blocker stops before summary or archive and preserves remaining risks."
    capability_refs: [public:close-task/close, internal:closure-eligibility-gate, internal:source-authority-policy, internal:release-evidence-gate, internal:orchestration-route-resolver]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..working-tree, evidence: [acceptance-blocker-open, remaining-risk-recorded] }
    invocation: { entry: close-task, mode: close, legacy_alias: close-current-task }
    expected: { guard: block, verdict: "Stop before archive while retaining blocker and remaining-risk evidence.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [closure-sequence-stopped, archive-not-created] }

  - id: MR-M04
    kind: row
    invariant: "Task creation cannot overwrite an existing active owner and must preserve complete scope and rollback fields."
    capability_refs: [public:prepare-task/create, internal:source-authority-policy, internal:scope-guard, internal:decision-authority-gate, internal:task-identity-guard, internal:design-evidence-gate, internal:release-evidence-gate, runtime:task-state-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: not-applicable, evidence: [existing-active-owner] }
    invocation: { entry: prepare-task, mode: create, legacy_alias: create-current-task }
    expected: { guard: block, verdict: "Do not replace the live owner; require an explicit lifecycle or supersede decision.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: not-applicable, evidence: [active-owner-conflict, current-task-unchanged] }

  - id: MR-M05
    kind: row
    invariant: "Design-baseline initialization creates only auditable design proposals and never feature code, an active task, or a locked runtime contract."
    capability_refs: [public:bootstrap-project/design, internal:source-authority-policy, internal:design-evidence-gate, internal:scope-guard]
    initial_state: { task_status: not-applicable, lifecycle_state: not-applicable, diff_target: not-applicable, evidence: [empty-project, no-meaningful-implementation] }
    invocation: { entry: bootstrap-project, mode: design, legacy_alias: design-baseline-init }
    expected: { guard: allow, verdict: "Produce design-baseline proposals only and leave API decisions draft until accepted.", writes: [docs/workflow/ROADMAP.md, docs/designs/architecture.md, docs/designs/database.md, docs/designs/detailed-design.md, docs/designs/api-contracts.md, docs/designs/domain-model.md, docs/workflow/BASELINES.md, docs/workflow/DECISIONS.md], handoff: not-applicable, terminal_behavior: manual-decision, diff_target: not-applicable, evidence: [design-source-created, api-remains-draft, business-code-unchanged] }

  - id: MR-M06
    kind: row
    invariant: "Greenfield governance consumes confirmed design; missing architecture, database, or API baselines route back to design."
    capability_refs: [public:bootstrap-project/greenfield, internal:source-authority-policy, internal:design-evidence-gate, internal:scope-guard]
    initial_state: { task_status: not-applicable, lifecycle_state: not-applicable, diff_target: not-applicable, evidence: [architecture-baseline-missing] }
    invocation: { entry: bootstrap-project, mode: greenfield, legacy_alias: greenfield-init }
    expected: { guard: block, verdict: "Do not invent governance facts; return to the design baseline gate.", writes: [], handoff: bootstrap-project:design, terminal_behavior: continue, diff_target: not-applicable, evidence: [missing-baseline-identified, business-code-unchanged] }

  - id: MR-M07
    kind: row
    invariant: "Interrupted recovery packages require checkpoint, dirty attribution, environment, and recovery evidence before becoming resumable."
    capability_refs: [public:task-lifecycle/interrupt, internal:lifecycle-transition-guard, internal:task-identity-guard, internal:scope-guard, runtime:lifecycle-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: working-tree, evidence: [dirty-attribution-missing, recovery-strategy-missing] }
    invocation: { entry: task-lifecycle, mode: interrupt, legacy_alias: interrupt-current-task }
    expected: { guard: block, verdict: "Do not create a success-shaped resumable package when recovery evidence is incomplete.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [missing-interrupt-evidence, no-lifecycle-transition] }

  - id: MR-M08
    kind: row
    invariant: "Legacy inventory discovers actual repository paths and records confirmed, inferred, and unknown facts with evidence without creating an active task."
    capability_refs: [public:bootstrap-project/inventory, internal:source-authority-policy, internal:propagation-evidence-validator, internal:scope-guard]
    initial_state: { task_status: not-applicable, lifecycle_state: not-applicable, diff_target: not-applicable, evidence: [nonstandard-source-layout, unknown-consumer] }
    invocation: { entry: bootstrap-project, mode: inventory, legacy_alias: legacy-inventory }
    expected: { guard: allow, verdict: "Record actual paths and retain the unknown consumer classification; do not edit product code or create a live task.", writes: [docs/adoption/architecture-inventory.md, docs/adoption/database-inventory.md, docs/adoption/API_INVENTORY.md, docs/adoption/RISK_REGISTER.md, docs/adoption/ADOPTION_REPORT.md, docs/workflow/ROADMAP.md], handoff: bootstrap-project:adopt, terminal_behavior: continue, diff_target: not-applicable, evidence: [actual-paths-recorded, unknown-retained, code-unchanged] }

  - id: MR-M09
    kind: row
    invariant: "Scope is default-deny and widening requires regenerated Allowed, Conditional, and Forbidden buckets plus risk and validation evidence."
    capability_refs: [public:prepare-task/scope-lock, internal:scope-guard, internal:dangerous-operation-gate, internal:propagation-evidence-validator, runtime:task-state-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: working-tree, evidence: [unlisted-diff-path, no-scope-widening-record] }
    invocation: { entry: prepare-task, mode: scope-lock, legacy_alias: lock-scope }
    expected: { guard: block, verdict: "Block the unlisted path until the entire scope contract is regenerated and confirmed.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [default-deny-triggered, widening-requirements-listed] }

  - id: MR-M10
    kind: row
    invariant: "Pause-only creates a recoverable paused package and never starts or switches to another task."
    capability_refs: [public:task-lifecycle/pause, internal:lifecycle-transition-guard, internal:task-identity-guard, internal:scope-guard, runtime:lifecycle-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..working-tree, evidence: [pause-only-request, closure-work-pending] }
    invocation: { entry: task-lifecycle, mode: pause, legacy_alias: pause-current-task }
    expected: { guard: allow, verdict: "Persist one paused_pending_closure package and leave no next task active.", writes: ["TASKS/paused/TASK-<id>-<slug>.md", "docs/workflow/CURRENT_TASK.md"], handoff: not-applicable, terminal_behavior: manual-decision, diff_target: preserve, evidence: [paused-package-readback, no-next-task-created] }

  - id: MR-M11
    kind: row
    invariant: "Planning blocks when current third-party behavior affects correctness and no current documentation evidence is available."
    capability_refs: [public:prepare-task/plan, internal:decision-authority-gate, internal:propagation-evidence-validator, internal:external-documentation-gate, internal:adaptive-depth-policy, runtime:task-state-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: not-applicable, evidence: [new-sdk-behavior-required, current-doc-evidence-unavailable] }
    invocation: { entry: prepare-task, mode: plan, legacy_alias: plan-implementation }
    expected: { guard: block, verdict: "Do not guess the SDK behavior; record the documentation blocker and stop for evidence or user direction.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: not-applicable, evidence: [external-doc-gate-triggered, blocked-reason] }

  - id: MR-M12
    kind: row
    invariant: "Delivery summaries preserve missing health, release, rollback, and observation evidence as blocked or remaining risk rather than complete."
    capability_refs: [public:close-task/summary, internal:closure-eligibility-gate, internal:release-evidence-gate]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..working-tree, evidence: [release-task, health-evidence-missing] }
    invocation: { entry: close-task, mode: summary, legacy_alias: prepare-delivery-summary }
    expected: { guard: block, verdict: "Report the missing health evidence explicitly and do not label the delivery complete.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [blocked-summary-language, remaining-risk-preserved] }

  - id: MR-M13
    kind: row
    invariant: "Interrupted resume requires one explicit unique package and complete recovery evidence; multiple candidates are never auto-selected."
    capability_refs: [public:task-lifecycle/resume-interrupted, internal:lifecycle-transition-guard, internal:task-identity-guard, internal:resume-review-gate, internal:owner-route-resolver, runtime:lifecycle-transaction]
    initial_state: { task_status: suspended, lifecycle_state: interrupted, diff_target: not-applicable, evidence: [two-interrupted-packages, no-explicit-package] }
    invocation: { entry: task-lifecycle, mode: resume-interrupted, legacy_alias: resume-interrupted-task }
    expected: { guard: ask-user, verdict: "Require explicit package selection; do not rehydrate either candidate automatically.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: not-applicable, evidence: [candidate-ambiguity, active-owner-unchanged] }

  - id: MR-M14
    kind: row
    invariant: "Paused resume rehydrates a complete explicit package to active ownership and forces task review with normalized reasons."
    capability_refs: [public:task-lifecycle/resume-paused, internal:lifecycle-transition-guard, internal:task-identity-guard, internal:resume-review-gate, internal:owner-route-resolver, runtime:lifecycle-transaction]
    initial_state: { task_status: suspended, lifecycle_state: paused_pending_closure, diff_target: task-base..checkpoint, evidence: [explicit-paused-package, complete-recovery-payload, ready-for-resume] }
    invocation: { entry: task-lifecycle, mode: resume-paused, legacy_alias: resume-paused-task }
    expected: { guard: allow, verdict: "Rehydrate to active plus active, retain recovery evidence, and force review before execution.", writes: ["docs/workflow/CURRENT_TASK.md", "TASKS/paused/TASK-<id>-<slug>.md"], handoff: prepare-task:review, terminal_behavior: continue, diff_target: preserve, evidence: [active-owner-restored, resume-requires-review, normalized-review-reasons] }

  - id: MR-M15
    kind: row
    invariant: "Report-only diff review is strictly read-only, uses the task range even with a clean working tree, and never syncs, debugs, resumes, or repairs."
    capability_refs: [public:review-change/report-only, internal:read-only-review-guard, internal:diff-target-resolver, internal:validation-layer-gate, internal:propagation-evidence-validator]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..checkpoint, evidence: [working-tree-clean, checkpoint-recorded, finding-observed] }
    invocation: { entry: review-change, mode: report-only, legacy_alias: review-current-diff }
    expected: { guard: allow, verdict: "Report the finding against the committed range and terminate without mutation or handoff.", writes: [], handoff: not-applicable, terminal_behavior: report-only, diff_target: preserve, evidence: [range-reviewed, report-emitted, zero-mutation] }

  - id: MR-M16
    kind: row
    invariant: "Task review cannot clear recovery metadata or make a resumed task executable when checkpoint, diff target, or review reasons are missing."
    capability_refs: [public:prepare-task/review, internal:source-authority-policy, internal:scope-guard, internal:decision-authority-gate, internal:task-identity-guard, internal:resume-review-gate, runtime:task-state-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: not-applicable, evidence: [resumed-task, resume-reason-missing] }
    invocation: { entry: prepare-task, mode: review, legacy_alias: review-current-task }
    expected: { guard: block, verdict: "Keep recovery metadata and block execution until resume evidence and a diff target are complete.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: required, evidence: [resume-review-gap, metadata-preserved] }

  - id: MR-M17
    kind: row
    invariant: "Scope review resolves one explicit diff target, remains read-only, and admits mechanical findings instead of repairing them directly."
    capability_refs: [public:review-change/scope, internal:read-only-review-guard, internal:diff-target-resolver, internal:scope-guard, internal:propagation-evidence-validator, internal:finding-admission]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..checkpoint, evidence: [forbidden-path-in-range] }
    invocation: { entry: review-change, mode: scope, legacy_alias: review-diff }
    expected: { guard: block, verdict: "Report the Forbidden-path blocker against the recorded range without repairing or changing scope.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [scope-blocker, zero-mutation] }

  - id: MR-M18
    kind: row
    invariant: "Implementation review uses the shared diff target and cannot issue a clean verdict for unverifiable current third-party behavior."
    capability_refs: [public:review-change/implementation, internal:read-only-review-guard, internal:diff-target-resolver, internal:finding-admission, internal:external-documentation-gate]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..working-tree, evidence: [third-party-behavior-affects-verdict, current-doc-evidence-missing] }
    invocation: { entry: review-change, mode: implementation, legacy_alias: review-implementation }
    expected: { guard: block, verdict: "Return an unverifiable-behavior blocker rather than a clean implementation verdict.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [external-doc-gate-triggered, no-clean-verdict] }

  - id: MR-M19
    kind: row
    invariant: "Supersede is reserved for invalidated goal, scope, or acceptance; a new step or open finding alone does not replace the active record."
    capability_refs: [public:task-lifecycle/supersede, internal:lifecycle-transition-guard, internal:task-identity-guard, internal:decision-authority-gate, internal:propagation-evidence-validator, runtime:lifecycle-transaction, runtime:task-state-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: working-tree, evidence: [new-step-only, goal-still-valid] }
    invocation: { entry: task-lifecycle, mode: supersede, legacy_alias: supersede-current-task }
    expected: { guard: no-op, verdict: "Keep the active task; an additional step is not supersede evidence.", writes: [], handoff: not-applicable, terminal_behavior: complete, diff_target: preserve, evidence: [supersede-precondition-not-met, history-unchanged] }

  - id: MR-M20
    kind: row
    invariant: "Contract review uses the shared diff target, never loosens authority silently, and never repairs a contract during review."
    capability_refs: [public:review-change/contract, internal:read-only-review-guard, internal:diff-target-resolver, internal:source-authority-policy, internal:propagation-evidence-validator, internal:decision-authority-gate]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..checkpoint, evidence: [dto-semantics-changed, locked-contract-present] }
    invocation: { entry: review-change, mode: contract, legacy_alias: verify-contracts }
    expected: { guard: block, verdict: "Raise a contract blocker for the DTO semantic change; do not loosen or edit the contract.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [contract-drift, zero-contract-mutation] }

  - id: MR-R01
    kind: row
    invariant: "Archive commits only from materialized identity and complete closure evidence; invalid tuples and placeholder identity fail closed."
    capability_refs: [public:close-task/archive, internal:closure-eligibility-gate, internal:task-identity-guard, internal:source-authority-policy, runtime:archive-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..working-tree, evidence: [placeholder-task-id, acceptance-incomplete] }
    invocation: { entry: close-task, mode: archive, legacy_alias: archive-task }
    expected: { guard: block, verdict: "Reject the archive proposal before creating or replacing any task artifact.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [identity-invalid, acceptance-open, zero-partial-write] }

  - id: MR-R02
    kind: row
    invariant: "Contract commits accept only verified stable boundaries and require authority before relaxing a locked contract."
    capability_refs: [public:sync-state/contracts, internal:source-authority-policy, internal:decision-authority-gate, internal:propagation-evidence-validator, runtime:contract-candidate-commit]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..checkpoint, evidence: [locked-contract-relaxation, user-authority-missing] }
    invocation: { entry: sync-state, mode: contracts, legacy_alias: sync-contracts }
    expected: { guard: block, verdict: "Reject the relaxation proposal and leave the locked contract unchanged.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: preserve, evidence: [authority-gap, contract-unchanged] }

  - id: MR-R03
    kind: row
    invariant: "Task-state sync records actual failures, open acceptance, history, and risk without beautifying evidence into completion."
    capability_refs: [public:sync-state/task, internal:source-authority-policy, internal:scope-guard, runtime:task-state-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..working-tree, evidence: [validation-failed, acceptance-open] }
    invocation: { entry: sync-state, mode: task, legacy_alias: sync-current-task }
    expected: { guard: allow, verdict: "Persist the failed validation and visible risk while keeping acceptance open.", writes: ["docs/workflow/CURRENT_TASK.md"], handoff: not-applicable, terminal_behavior: complete, diff_target: preserve, evidence: [failure-retained, risk-visible, history-not-erased] }

  - id: MR-R04
    kind: row
    invariant: "Decision sync records only explicitly confirmed decisions and preserves append-only supersession history."
    capability_refs: [public:sync-state/decisions, internal:source-authority-policy, internal:decision-authority-gate, runtime:decision-record-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: not-applicable, evidence: [unconfirmed-suggestion] }
    invocation: { entry: sync-state, mode: decisions, legacy_alias: sync-decisions }
    expected: { guard: block, verdict: "Reject an unconfirmed suggestion; no decision authority may be fabricated by Runtime.", writes: [], handoff: ask-user, terminal_behavior: manual-decision, diff_target: not-applicable, evidence: [confirmation-missing, decision-log-unchanged] }

  - id: MR-R05
    kind: row
    invariant: "Host guidance stays semantically paired, durable, and project-wide while preserving necessary host differences and target-owned content."
    capability_refs: [public:sync-state/host-guidance, internal:source-authority-policy, internal:host-isolation-guard, internal:decision-authority-gate, runtime:paired-host-guidance-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: not-applicable, evidence: [temporary-workaround-only] }
    invocation: { entry: sync-state, mode: host-guidance, legacy_alias: sync-host-guidance }
    expected: { guard: no-op, verdict: "Do not globalize a temporary workaround or rewrite target-owned host guidance.", writes: [], handoff: not-applicable, terminal_behavior: complete, diff_target: not-applicable, evidence: [non-durable-rule-rejected, host-files-unchanged] }

  - id: MR-R06
    kind: row
    invariant: "Finding sync admits only current-owner, in-scope, evidence-complete mechanical findings and deduplicates replay."
    capability_refs: [public:sync-state/findings, internal:finding-admission, internal:owner-route-resolver, internal:scope-guard, runtime:finding-queue-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: task-base..checkpoint, evidence: [stale-owner-finding] }
    invocation: { entry: sync-state, mode: findings, legacy_alias: sync-review-findings }
    expected: { guard: no-op, verdict: "Reject the stale-owner finding without adding it to the mechanical repair queue.", writes: [], handoff: not-applicable, terminal_behavior: complete, diff_target: preserve, evidence: [ownership-mismatch, queue-unchanged] }

  - id: MR-R07
    kind: row
    invariant: "Project status is descriptive only and cannot claim stable while release, canary, benchmark, or rollback evidence is incomplete."
    capability_refs: [public:sync-state/status, internal:source-authority-policy, internal:release-evidence-gate, runtime:project-status-transaction]
    initial_state: { task_status: active, lifecycle_state: active, diff_target: not-applicable, evidence: [benchmark-pending, stable-claim-proposed] }
    invocation: { entry: sync-state, mode: status, legacy_alias: sync-status }
    expected: { guard: allow, verdict: "Record observing or blocked status rather than stable.", writes: ["docs/workflow/STATUS.md"], handoff: not-applicable, terminal_behavior: complete, diff_target: not-applicable, evidence: [benchmark-pending-retained, stable-claim-rejected] }

  - id: MR-D01
    kind: row
    invariant: "Decision classification keeps Taste visible, user-challenge choices user-owned, and only mechanical choices autonomous."
