# All public entries use the internal run-entry driver for typed operations.
# entry-operation-result/v1 carries invocation, recovery history and original
# outcome; recovery-required is an agent continuation, not a user-facing terminal.
# A blocked ordinary retry admits diagnosed paths against current task/step
# authority; the failed preflight is retained evidence, not a future path limit.
# Its newly diagnosed paths require a fresh covering preflight before mutation.
# recovery-applied requires read-back before resuming a still-needed original
# operation; committed original operations are never blindly replayed.
schema_version: 1
kind: vnext-source-contract
phase: Phase 2

source_namespace:
  root: templates/vnext
  skill_templates: templates/vnext/skills
  contract_file: .workflow-system/vnext/SOURCE_CONTRACT.yaml
  installable: false
  generated: false
  host_sync: false

entries:
  - id: prepare-task
    exposure: daily
    template: templates/vnext/skills/prepare-task.SKILL.md.tmpl
  - id: review-draft
    exposure: daily
    template: templates/vnext/skills/review-draft.SKILL.md.tmpl
  - id: review-change
    exposure: daily
    template: templates/vnext/skills/review-change.SKILL.md.tmpl
  - id: execute-step
    exposure: daily
    template: templates/vnext/skills/execute-step.SKILL.md.tmpl
  - id: debug-task
    exposure: daily
    template: templates/vnext/skills/debug-task.SKILL.md.tmpl
  - id: task-lifecycle
    exposure: daily
    template: templates/vnext/skills/task-lifecycle.SKILL.md.tmpl
  - id: capture-work-item
    exposure: daily
    template: templates/vnext/skills/capture-work-item.SKILL.md.tmpl
  - id: close-task
    exposure: daily
    template: templates/vnext/skills/close-task.SKILL.md.tmpl

administrative_entries:
  - id: bootstrap-project
    exposure: admin
    template: templates/vnext/skills/bootstrap-project.SKILL.md.tmpl

expert_entries:
  - id: validate-change
    exposure: expert
    template: templates/vnext/skills/validate-change.SKILL.md.tmpl
  - id: git-commit
    exposure: expert
    template: templates/vnext/skills/git-commit.SKILL.md.tmpl

capabilities:
  - id: project-context-resolver
    exposure: internal
    trigger:
      - every entry that needs canonical project truth
    input_contract:
      - target root identity
      - intent and task identity
      - scope, changed surfaces, claims, and risk triggers
      - local Markdown/YAML sources, path/symbol queries, and heading/ID locators
      - project profile documentation seeds and the existing project documentation center
      - optional Contract/Decision implementation anchors from the current knowledge context
    output_contract:
      - relevant source locators
      - authority, relevance, freshness, conflicts, and exclusions
      - current/stale/unresolved anchor status and bounded live-search seeds
      - risk-appropriate impact expansion across references, callers, imports, consumers, types, schemas, configuration, generated surfaces, and tests
    stop_conditions:
      - unsupported schema
      - unresolved mandatory authority conflict
      - unsafe locator or missing required context

  - id: source-authority-policy
    exposure: internal
    trigger:
      - a decision, fact, or evidence source may govern the intent
    input_contract:
      - candidate sources and their source revisions
      - authority class and precedence
    output_contract:
      - authoritative source selection
      - explicit conflict and unresolved-fact report
    stop_conditions:
      - authority cannot be established
      - a lower-authority source would be required to override a higher one

  - id: task-identity-guard
    exposure: internal
    trigger:
      - a request may create, replan, or mutate a task
    input_contract:
      - task identity and active-owner tuple
      - requested intent and caller authority
    output_contract:
      - verified task identity
      - allowed owner transition or non-mutation result
    stop_conditions:
      - missing or ambiguous identity
      - multiple active owners
      - caller is not authorized for the requested task mutation
      - a new identity collides with a canonical task artifact, previous task reconciliation is incomplete, draft steps lack strict metadata/first-step admission, or confirmation is not bound to current task identity, document identity, and exact draft revision

  - id: scope-guard
    exposure: internal
    trigger:
      - product or governance mutation is proposed
    input_contract:
      - mutation_authority_version, when the task explicitly opts into v2
      - v1 canonical CURRENT_TASK Allowed Files, Conditional Files, and Forbidden Files buckets
      - v2 task authority envelope of authorized project domains, exact exceptions, and task forbidden targets
      - v2 planning declarations for every planned target, exact command write, bounded command footprint, and persistent-test path
      - the canonical project authority-domain map and its revision bound to a confirmed v2 task
      - explicit changed paths or one verified diff target
      - transformation kind, distinguishing localized from inherently-broad mutation
      - v1 conditional authorizations with exact target, evidence references, and authority
      - v2 blast-radius assessments for planned-footprint expansions, including evidence refs and self-admit/escalate disposition
      - separate Read / discovery context, which is allowed to be broader but is not write authority
    output_contract:
      - v1 per-path mutation admission or blocker with Forbidden precedence and default-deny
      - v2 structural admission that resolves path to exactly one authority domain, applies task forbidden/governance boundaries, and distinguishes planned from self-admitted targets
      - v2 planning-time proof that every declared mutation is inside an authorized domain or exact exception before a confirmed definition is committed
      - deterministic subset proof for every v2 command footprint; synthetic probe paths are not evidence of command safety
      - separate read/discovery matches that never become write permission
      - exact admitted paths, excluded targets, and source revision
      - v2 dynamic expansion record with first-touch before-state and risk-selected cumulative review flag
      - bounded widening requirement; changed goal, scope, or total authority routes to authority amendment, while same-envelope implementation discovery uses extend-preflight
      - separate persistent-test admission for an absent new test, including a typed P-12 decision even when no authority domain changes
      - authority-amendment settlement gate that blocks only an admitted preflight without its matching recorded execution result
      - explicit project-owner domain candidates/confirmation lifecycle and a stable authority-domain revision for active v2 execution
      - owner-confirmed project domain initialization or additive maintenance with a before/after receipt; separate active-task rebind without inherited widening or preflight bypass
    stop_conditions:
      - v1 required scope bucket is missing, malformed, duplicated, or ambiguous
      - v1 target is outside admitted scope
      - v2 target is outside the task authority envelope or is unclassified without an exact exception
      - v2 planned target, command write, command glob, or persistent-test path fails planning-time authority proof
      - a v2 command footprint cannot be mechanically proven as a subset of one granted domain root
      - v2 path-to-domain resolution is ambiguous
      - forbidden or governance target is requested
      - v1 Conditional target lacks an exact authorization with evidence and authority
      - v2 in-envelope unplanned target lacks a complete blast-radius assessment or is escalated
      - an absent new persistent test lacks a complete typed P-12 admission; Runtime must not invent owner, basis, insufficiency, boundary, or failure facts
      - a broad glob is used without an inherently-broad transformation
      - the changed-path diff target is empty, duplicated, invalid, or not explicit
      - read/discovery context is treated as write authority
      - true authority widening lacks explicit user authorization or the goal, acceptance, or task authority changed without the authority-amendment route
      - a confirmed v2 task observes a changed or missing project authority-domain revision without explicit task authority-domain revalidation

  - id: decision-authority-gate
    exposure: internal
    trigger:
      - implementation requires a non-mechanical choice
    input_contract:
      - decision candidate, constraints, and existing authority
      - user-owned, contract-owned, and mechanical categories
    output_contract:
      - classified decision
      - authorized choice or explicit user blocker
    stop_conditions:
      - user-owned choice is unresolved
      - proposed choice conflicts with a confirmed Contract or Decision

  - id: mutation-authority-policy
    exposure: internal
    trigger:
      - a v2 task selects an authority envelope or evaluates an implementation-footprint expansion
    input_contract:
      - project domain map, task authority envelope, exact exceptions, and forbidden targets
      - planning-time declaration set and the bound project authority-domain revision
      - planned mutation footprint and actual changed target
      - Runtime-derived execution phase from the frozen Test Strategy and current-step evidence obligation; candidate-path composition cannot select the phase
      - blast-radius evidence covering locality, visibility, consumers, contract impact, and regression coverage
      - read/discovery findings across domains, kept separate from write authority
    output_contract:
      - bounded self-admit or escalate disposition for an in-envelope unplanned target
      - smallest-correct-local-change decision with evidence for any broader shared change
      - explicit authority-amendment blocker for cross-domain or unclassified writes
      - planning-time executable-definition proof and deterministic command-footprint subset result
      - project inventory domain candidates kept non-authorizing until an explicit owner confirmation promotes them to the canonical profile
      - 'distinct persistent-test admission transition with authority_diff: none for an in-envelope absent test'
      - distinct runtime errors for missing blast-radius assessment, escalated assessment, and true authority expansion
      - planned, expanded, and actual footprint material for cumulative review
      - execution-identity-bound dynamic admissions; historical expansions never become a current-step write grant
      - clean-review consumption bound to the reviewed execution identity and retained per expansion
    stop_conditions:
      - authority ownership cannot be resolved from the project domain map
      - project domain candidates are treated as a grant without owner confirmation, or a confirmed task's domain-map revision is stale; ordinary correction-replan, P-12 admission, and exact-path amendment must not rebind it
      - a target is outside the task envelope, explicitly forbidden, or on a governance boundary
      - the expansion assessment is incomplete, uncertain, or escalated
      - a broader shared change lacks evidence that the local alternative is incorrect, duplicative, or contract-breaking
      - a persistent-test admission is incomplete or attempts to use Runtime-generated defaults
    execution_admission_binding:
      evaluator: runtime-owned-exact-target-admission/v1
      applies_to:
        - blocked-step-retry-diagnosis
        - ordinary-preflight
        - same-attempt-extension
        - repair-preflight
        - repair-same-attempt-extension
        - command-footprint-preflight
        - result-recording-recheck
      classifications:
        - planned-admitted
        - dynamic-self-admitted
        - persistent-test-admitted
        - blocked-authority
        - blocked-assessment
        - blocked-test-strategy
        - blocked-persistent-test
        - blocked-non-executable-policy
        - blocked-governance
      identity:
        stable_execution_id: required_for_new_v2_execution_and_expansion
        replacement_receipt: required_after_extension
        retry_budget_effect: none_for_same_attempt_or_repair_wave

  - id: adaptive-depth-policy
    exposure: internal
    trigger:
      - every Phase 1 entry invocation
    input_contract:
      - risk surface, uncertainty, changed surfaces, and evidence needs
    output_contract:
      - selected risk profile
      - triggered conditional capabilities and skipped-capability reasons
    stop_conditions:
      - a mandatory gate would be skipped
      - risk evidence is insufficient to select a safe depth

  - id: draft-consistency-challenge
    exposure: internal
    trigger:
      - review-draft evaluates a complete candidate draft against its verbatim request, authoritative sources, evidence plan, and step repairability
    input_contract:
      - verbatim request and exact source locators with authority, relevance, and freshness
      - candidate acceptance, decided and unresolved choices, mutation scope, implementation steps, validation plan, and persistent-test proof claims
      - relevant project facts needed to judge feasibility, excluding the draft author's rationale and prior conclusion
      - transient semantic delta map and path-by-step interaction map
    output_contract:
      - 'one ephemeral verdict: no-material-gap, repairable-gap, or user-decision-required'
      - bounded discrepancies with request or source reference, draft reference, material impact, and correction owner
      - explicit cross-step repairability gaps where planned integration or validation can expose a failure outside the current step scope
      - no authority decision, scope expansion, Runtime proposal, finding-queue write, review receipt, or durable review state
    stop_conditions:
      - the verbatim request, source provenance, candidate draft, or relevant feasibility context is unavailable
      - the challenge would need to invent a user-owned decision, broaden the task, or act as a public review entry

  - id: propagation-evidence-validator
    exposure: internal
    trigger:
      - shared API, DTO, event, schema, or generated surface is affected
    input_contract:
      - changed contract surface and known consumers
      - compatibility and linked-regression claims
    output_contract:
      - propagation impact map
      - claim-bound compatibility and regression evidence gaps
    stop_conditions:
      - impacted consumer or contract cannot be identified
      - required propagation evidence is unavailable

  - id: design-evidence-gate
    exposure: internal
    trigger:
      - UI or visual acceptance is in scope
    input_contract:
      - confirmed design source, anchors, and acceptance claims
    output_contract:
      - design evidence requirements and verdict
      - visual deviation or missing-evidence report
    stop_conditions:
      - no confirmed design authority exists
      - visual acceptance cannot be verified

  - id: release-evidence-gate
    exposure: internal
    trigger:
      - deployment, migration, release, benchmark, or canary behavior is affected
    input_contract:
      - release claims, rollback plan, observation window, and health checks
    output_contract:
      - release evidence plan and rollback/observation verdict
    stop_conditions:
      - rollback or observation authority is missing
      - release evidence is incomplete for the claimed outcome

  - id: external-documentation-gate
    exposure: internal
    trigger:
      - current third-party library, framework, SDK, API, CLI, or cloud behavior affects correctness
    input_contract:
      - affected dependency behavior and exact current documentation claim
      - dependency/version context and source revision
    output_contract:
      - current authoritative documentation evidence
      - applicability and unresolved documentation conflict
    stop_conditions:
      - required current documentation cannot be obtained
      - documentation evidence does not support the implementation assumption

  - id: resume-review-gate
    exposure: internal
    trigger:
      - replan or recovery is requested against an existing task snapshot
    input_contract:
      - exact task identity, checkpoint, dirty attribution, and recovery package
    output_contract:
      - readiness decision and verified next intent
    stop_conditions:
      - snapshot identity or source revision mismatches
      - recovery package is incomplete or ambiguous

  - id: read-only-review-guard
    exposure: internal
    trigger:
      - review-draft or review-change is invoked in any mode
    input_contract:
      - review request and declared side-effect policy
    output_contract:
      - read-only execution boundary
      - governed mutation count and ephemeral-effects accounting
    stop_conditions:
      - a product, governance, queue, registry, install, or host write is requested

  - id: diff-target-resolver
    exposure: internal
    trigger:
      - review or execution needs a change target
    input_contract:
      - task base/checkpoint and current revision
      - requested path, symbol, or logical diff target
    output_contract:
      - one verified logical diff target and comparable revisions
    stop_conditions:
      - target is missing, stale, ambiguous, or mismatched

  - id: evidence-admission-policy
    exposure: internal
    trigger:
      - a claim, evidence gap, or persistent-test decision is evaluated
    input_contract:
      - 'claim model: id, kind, owner_source, certainty, impact, and existing_evidence'
      - 'invariant-admission/v1: classify invariants as bounded local/temporal mechanical or global/domain/permanent and preserve the authority, scope, and lifetime supported by the claim'
      - 'invariant admission records why the chosen semantic strength is needed and who owns it; implementation convenience alone is not authority'
      - 'bounded local mechanical invariants may be admitted without another user confirmation only when they are reversible, tied to a named operation, transition, or task boundary, and supported by accepted-task, confirmed-bug, or anchored-risk changed-behavior evidence'
      - 'global/domain/permanent/schema invariants require confirmed owner_source contract or user authority, shared or critical impact, and existing evidence for an explicit Contract/Decision or user-owned design/contract decision'
      - 'initial/default acceptance and current-task exclusion must not be upgraded into a global/permanent restriction; confirmed current acceptance may control bounded task behavior but does not rewrite future design/baseline semantics unless an explicit contract/design decision changes them'
      - proposed minimum-sufficient evidence type and expected disposition
      - 'execution selection is claim-bound and frozen: choose the minimum-sufficient whole evidence set by detection, real boundary, and total cost; focused is preferred only when equally effective and no broader independently authorized obligation is lost; target, E2E, and broad regression require explicit scope/breadth reason and allowed basis'
      - 'business-flow claims retain integration/flow evidence and cannot be completed by accumulated local unit PASS results'
      - 'evidence types may include static proof, existing regression, focused test, integration smoke, browser/session check, visual evidence, real-device evidence, external documentation, release health/canary, and explicit human acceptance'
      - 'evidence-plan decision: whether new evidence is needed, minimum-sufficient type, existing-check reuse, temporary exploration, and failure route'
      - 'prepare-task creates and persists a non-empty canonical CURRENT_TASK.runtime_state.claim_evidence plan with at least one acceptance claim; each claim has stable claim_id/claim_kind and each planned slot has slot_id, minimum_type, disposition, and evidence_refs'
      - 'migrate-claim-evidence is a Runtime-compatibility-owned internal transition, not a public prepare-task semantic command; it remains reachable through the low-level Runtime API for legacy active + active tasks, installs only a non-empty acceptance-bearing plan, and preserves task identity, definition, scope, acceptance, implementation state, execution history, findings, review state, and lifecycle tuple'
      - 'existing, reused, and newly-executed slots require evidence_refs; missing, deferred, and blocked slots are not completion evidence'
      - 'counterevidence binds an existing claim/slot/result and a retained file hash; contested conclusions block dependent execution and closure without rewriting historical reports'
      - 'a contested challenge may be dismissed only with a bound, hashed review assessment; dismissal retains the challenge and original report'
      - 'correction-replan-candidate/v2 supports conclusion-correction and execution-recovery with bounded targets, forward-fix/artifact-restore/mixed, complete obligation mapping, immutable executed definitions, new check identities, and revision-bound pending-step changes'
      - 'scope-amendment-candidate/v1 is an independent additive route: authority expansion consumes caller-reported explicit authorization for exact new paths, while an in-envelope absent persistent test uses the same infrastructure with a complete typed P-12 admission and authority_diff:none; both preserve pending review/findings/obligations/review baseline/budget and never change the legacy correction-replan/v2 permission_change:none semantics'
      - 'Mutation Authority v2: the task authority envelope is the only hard mutation boundary; planned step targets are guidance, same-envelope expansion requires a bounded blast-radius assessment and risk-selected review (private local/no-consumer/no-contract-impact discovery adds no checkpoint), and cross-domain authority changes require explicit amendment'
      - 'a blocked ordinary step may diagnose a repair path absent from its failed preflight when current task/step authority admits it; retry retains the failed attempt and clears stale preflight, while a fresh covering preflight is mandatory before writing or recording the resumed execution; v2 unplanned paths still require blast-radius assessment'
      - 'Mutation Authority v2 distinguishes an existing in-envelope test file from an absent new persistent test; only the latter requires the existing P-12 admission record before creation'
      - 'compact-v3 CURRENT_TASK is a lossless active projection selecting immutable definition/state roots in the same task aggregate; exact body sections and claim definitions are reused, reports and current review material are referenced, and ordinary result writes do not recopy the full frozen definition into active state'
      - 'storage compaction never changes task identity, authority, evidence selection, user decisions, findings or budgets; old inline/compact-v2 tasks remain readable, exact legacy preimages are retained, and migration is explicit without a file-size quota or a new lifecycle gate'
      - 'storage-only migration preserves issued confirmation, execution/repair, review and recovery-candidate bindings through committed exact-preimage lineage; any intervening business transaction remains stale, and physical write/publication/paging revisions are not aliased'
      - 'compact-v3 reads validate its frozen version-specific projection model against immutable roots, independently of current YAML emission; historical golden bytes remain readable and changed hot fields, summary facts or material remain invalid'
      - 'validate --summary storage_metrics are read-only observations of physical bytes, normalized logical views and the latest committed event delta; they never persist counters, consume receipts, alter authority or gate progress; unavailable or bounded-out measurements are null with coverage reasons, not zero or inferred history'
      - 'review coverage stores only path/state/sha256 in canonical CURRENT_TASK; first-touch bytes are immutable raw content-addressed blobs resolved by sha256, and legacy inline preimages are readable and explicitly migrated before canonical compaction'
      - 'confirmation preserves task identity, original request, acceptance and total authority; binds source, Basis, candidate, evidence admission, restore plan and all old obligations; authorization remains caller-reported'
      - 'partial correction of multiple challenges against one report retains the original result references; later batches traverse bounded confirmed correction relationships backed by verified source preimages, real results and clean completion snapshots, retaining both selected challenge origins and the reports actually replaced and require fresh evidence and review'
      - 'recovery problem budgets inherit through confirmed execution targets and replacement step identities, including historical v2 candidates; a new step ID cannot reset retained failures; raw step-progress also requires the durable current admitted attempt'
      - 'artifact restore success requires a Runtime-persisted candidate-and-attempt-bound completion fact plus exact restored targets; caller-reported passed commands do not satisfy this gate; direct execution receipt publication remains inside the interruption journal; environment retries revalidate exact targets and the immutable original receipt before minting a new attempt-bound v2 receipt, with fresh checks and review still required'
      - 'route-input separates unrelated input, conclusion counterevidence, execution errors and authority changes; relation assessment is caller-reported and never grants write permission'
      - 'ingest-evidence stores bounded content-addressed bodies and source coordinates; path references alone do not preserve external evidence bodies'
      - 'only Runtime-derived carry-forward may satisfy an unchanged old report under a new plan; challenged, stale-subject and before-step receipts cannot be silently reused'
      - 'upgrade preserves the old CURRENT_TASK bytes; explicit initialize-preservation saves exact task and Task Basis preimages before adding a version marker, and missing or unknown protection versions cannot authorize task replacement'
      - 'supersede preserves unfinished obligations and never authorizes a successor by itself; ordinary prepare-draft remains blocked, while explicit prepare-successor binds the retained predecessor, verbatim user decision, complete obligation disposition and a fresh draft that still needs ordinary confirmation'
      - 'same-task user-authorized evidence-plan amendment prepares an immutable candidate and confirms exact selection changes without requiring a report challenge; goal, acceptance, boundaries, authority, findings, failures and budgets are retained, affected evidence requires revalidation, and supersede is not a fallback for a missing selection route; a planned read-only invocation with no evidence slot may use the explicit unbound command scope-correction route only when it cannot borrow or merge with any slot or waiver'
      - 'ordinary execute-step results preserve the frozen claim/slot/check plan; replace-validation may replace one read-only invocation under unchanged observation, boundary, subjects, validation ownership, exact granularity, selector, authority and retained budgets, without a whole-task replan'
      - 'record-human-acceptance records an explicit Task Basis user observation for a frozen human check; record-evidence-waiver discharges only an exact user-owned current obligation and its exclusively bound validation labels, rechecked at record and consumption, without rewriting failed/missing reports as PASS; both are caller-reported and cannot authorize administrative realign'
      - 'user evidence decisions remain source/subject/plan bound and visible in context and archive; raw progress cannot manufacture them, prerequisites and policy/contract obligations are not waived, and required review/findings remain intact'
      - 'legacy CURRENT_TASK documents remain readable but require prepare-task refinement/migration before task-complete or terminal close-task; aggregate command success cannot provide completion compatibility'
      - 'exploratory probe budget: duration, tool/run count, permitted temporary artifact locations, and cleanup/audit rule'
      - persistent-test policy, including default non-admission or user no-test deny
      - 'persistent-test admission fields when a persistent test is proposed: owner, basis, proves, existing-evidence insufficiency, assertion boundary, and failure disposition'
      - 'risk-analysis admission is anchored to an identified changed behavior, known failure model, and admitted task scope'
      - 'when an evidence plan must survive a turn, session, delegation, pause, or interruption: typed proposal to an existing canonical task record'
    output_contract:
      - claim-bound minimum-sufficient evidence plan that separates validation from test creation
      - 'durable claim-bound evidence completion state consumed by task-complete and close-task; aggregate command success or free-text notes cannot substitute for a slot disposition and evidence_refs'
      - 'minimum-sufficient execution selection with an exact due-step planned-command binding; a command PASS never automatically satisfies another claim slot'
      - 'claim -> slot/check observation and boundary -> independent selection granularity -> structured argv/selector or opaque command invocation -> exact result; opaque cannot claim focused; same-claim local rule and business-flow slots remain independent; new checks obey this invariant in draft, update, confirm, replan and recovery; unchanged confirmed legacy checks remain compatible'
      - 'focused business-flow cases are valid; target/broad granularity at every boundary requires breadth authority; even focused E2E requires E2E authority; explicit-user binds Task Basis; policy/release bind repository sources; claim bases bind exact current claim and its existing authoritative source without inventing a user decision'
      - 'invariant admission preserves semantic strength: bounded local/temporal mechanical claims remain reversible, while global/domain/permanent claims carry explicit authority and future-design conflict trace'
      - persistent-test not-admitted, admitted, deferred, or rejected decision separate from validation and existing-check reuse
      - 'admitted persistent tests only with an explicit owner, one of acceptance, regression, critical-invariant, or critical-risk, a behavioral or contract boundary assertion, and an expected failure disposition'
      - bounded exploratory-evidence record and cross-turn persistence status when triggered
    stop_conditions:
      - 'claim kind, owner_source, certainty, or impact is missing or outside its closed set'
      - 'an invariant upgrades an initial/default behavior or current-task exclusion into a global, permanent, or schema-level restriction without the required explicit authority'
      - 'a global/domain/permanent invariant lacks confirmed contract or user design authority, shared or critical impact, or explicit existing evidence'
      - 'a bounded local mechanical invariant lacks a named operation, transition, or task boundary, reversibility, or changed-behavior evidence'
      - 'current acceptance conflicts with a documented future design/baseline and the stronger restriction has no explicit contract/design decision'
      - a proposed persistent test has no authorized owner or authority source
      - evidence is insufficient or unrelated to the claim
      - 'a draft defaults from a related test file, target, or suite to whole-target validation without a smaller valid selection or an explicit breadth reason and basis'
      - 'business-flow evidence is replaced by local/unit evidence, or E2E/broad regression lacks its allowed admission basis'
      - 'task-complete or close-task relies on aggregate command success, notes, or model summary instead of the durable claim-bound evidence slots'
      - an exploratory probe lacks a bounded duration, tool/run count, permitted temporary artifact locations, or cleanup/audit rule
      - 'a persistent test lacks an explicit owner, closed admission basis, concrete claim, existing-evidence insufficiency reason, behavioral or contract boundary assertion, or expected failure disposition'
      - 'risk-analysis is used as a persistent-test owner without an identified changed behavior, known failure model, and admitted task scope'
      - 'provisional or exploratory certainty is used to silently admit a persistent test instead of a temporary probe or explicit confirmed reclassification'
      - a model-generated hypothetical, code change, coverage request, or incidental implementation detail is used as a persistent-test admission basis
      - an evidence plan that must survive a turn, session, delegation, pause, or interruption lacks a typed proposal into an existing canonical task record
      - user no-test policy conflicts with an authoritative Contract or Decision

  - id: finding-admission
    exposure: internal
    trigger:
      - review or repair proposes a finding for the current task
    input_contract:
      - evidence, owner route, scope, root-cause confidence, and fingerprint
      - existing open/resolved findings and repair budget
    output_contract:
      - admitted, deferred, rejected, or duplicate finding disposition
      - stable fingerprint and authorized route
    stop_conditions:
      - owner, scope, authority, evidence, root cause, or deduplication gate fails

  - id: review-convergence-policy
    exposure: internal
    trigger:
      - a repair is followed by review verification
    input_contract:
      - review cycle, repair-wave identities, finding fingerprints, attempt counters, and remaining budget
      - the same logical diff target and the active step's checkpoint policy
      - verification evidence and newly observed issues
    output_contract:
      - resolved, continue, debug, user, or blocked convergence verdict
      - updated bounded repair route
      - a clean verification receipt that can qualify the existing task-state advancement proposal
    stop_conditions:
      - reassessment identifies a necessary choice or authority not determined by the current invocation
      - the next route requires unknown root cause or user-owned authority
      - required verification or checkpoint evidence is absent, mismatched, or not tied to the active step

  - id: dangerous-operation-gate
    exposure: internal
    trigger:
      - a command or product operation has a dangerous or destructive surface
    input_contract:
      - exact command/target, risk, scope, and rollback/recovery plan
      - required confirmation and authority evidence
    output_contract:
      - authorized operation or explicit stop
    stop_conditions:
      - target or rollback is unclear
      - required confirmation or authority evidence is absent

  - id: knowledge-admission-policy
    exposure: internal
    trigger:
      - a durable Contract, Decision, or Lesson candidate is proposed
    input_contract:
      - candidate kind, statement, provenance, applicability, authority, stability, and evidence
      - semantic fingerprint and conflict set
      - optional implementation anchors observed from existing task evidence
    output_contract:
      - admit, merge, supersede, defer, reject, or no-op disposition
      - permitted uses and provenance-preserving reason
      - optional anchors retained as navigation hints, never as completeness or mutation authority
    stop_conditions:
      - authority, stability, reuse, conflict, or deduplication requirements fail

  - id: root-cause-loop
    exposure: internal
    trigger:
      - a defect, regression, or unexpected behavior needs a bounded causal investigation
    input_contract:
      - reproducible symptom and affected target
      - current task owner, admitted scope, and task evidence when the investigation is task-bound
      - available evidence and owner context for an independent or new-bug investigation
      - hypotheses, attempts, and investigation budget
    output_contract:
      - reproduced or unavailable result
      - validated root-cause statement or unresolved hypothesis set
      - authorized recovery route and remaining budget
    stop_conditions:
      - reproduction is unavailable after bounded attempts
      - required evidence remains unavailable after internal recovery and needs a concrete external prerequisite
      - proposed repair requires user, scope, or other-owner authority

  - id: owner-route-resolver
    exposure: internal
    trigger:
      - an observation, finding, lifecycle event, or work item may belong to different owners
    input_contract:
      - task identity and active-owner tuple when the route is task-bound
      - evidence, scope, and candidate owner routes
      - current lifecycle and authority state
    output_contract:
      - one canonical owner route
      - route evidence and guard-aware next action
      - explicit user or blocked result when no route is authorized
    stop_conditions:
      - owner cannot be established from authoritative evidence
      - route would cross task, scope, or lifecycle ownership
      - a guard-required transition is missing its evidence

  - id: lifecycle-transition-guard
    exposure: internal
    trigger:
      - a task pause, interruption, resume, supersede, or recovery transition is requested
    input_contract:
      - exact task identity and current workflow/lifecycle tuple
      - requested transition, snapshot, checkpoint, and dirty attribution
      - recovery strategy, rollback conditions, and authority evidence
    output_contract:
      - legal transition decision
      - complete snapshot/checkpoint/recovery requirements
      - normalized next lifecycle tuple or fail-closed result
    stop_conditions:
      - identity or current tuple is missing, stale, or ambiguous
      - transition is illegal or recovery evidence is incomplete
      - the request attempts hot migration of unsupported legacy state

  - id: record-only-intake-guard
    exposure: internal
    trigger:
      - a new work item is proposed while an active task exists
    input_contract:
      - relation to the active task and supporting evidence
      - proposed inbox record and duplicate/scope checks
      - owner route and record-only constraints
    output_contract:
      - unrelated, record-only admission decision
      - at most one inbox record proposal
      - explicit ask-user or blocked route for uncertainty or scope widening
    stop_conditions:
      - relation is uncertain or duplicate suspicion is unresolved
      - item belongs to the active task or requires scope widening
      - proposal would mutate task identity, lifecycle, catalog, or active state

  - id: closure-eligibility-gate
    exposure: internal
    trigger:
      - a task is proposed for preview, closure, delivery summary, or archive
    input_contract:
      - task identity, acceptance claims, validation evidence, and remaining risks
      - release/rollback/observation evidence when applicable
      - status, archive path, and explicit lesson candidates when supplied
    output_contract:
      - closure eligibility verdict
      - complete delivery/closure summary inputs
      - admitted Runtime proposals or a truthful blocker
    stop_conditions:
      - acceptance, validation, release, rollback, or observation evidence is incomplete
      - unresolved blocker is being presented as completion
      - identity, archive path, or remaining risk cannot be verified

  - id: host-isolation-guard
    exposure: internal
    trigger:
      - bootstrap or synchronization may touch a host guidance surface
    input_contract:
      - target host guidance path
      - target-owned, native, frozen, and workflow-owned asset classification
      - explicit host selection and conflict evidence
    output_contract:
      - isolated host mutation plan
      - preserved native/user-owned content
      - conflict or stop result for ambiguous ownership
    stop_conditions:
      - host ownership cannot be established
      - a native or frozen asset would be overwritten
      - host guidance ownership cannot be established

  - id: generation-atomicity-policy
    exposure: internal
    trigger:
      - bootstrap or synchronization generates more than one governed asset
    input_contract:
      - source artifact identity and generated target set
      - staging, validation, promotion, and rollback boundary
      - post-promotion read-back checks
    output_contract:
      - deterministic generated asset set
      - all-or-nothing promotion decision
      - read-back evidence and explicit recovery marker when interrupted
    stop_conditions:
      - generated output is stale, incomplete, or conflicting
      - validation cannot run before promotion
      - rollback or interruption state cannot be identified

