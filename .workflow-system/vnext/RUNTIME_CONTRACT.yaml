schema_version: 1
kind: vnext-runtime-contract
phase: Phase 2

runtime_distribution:
  kind: project-local-node
  package_path: .workflow-system/runtime
  entrypoint: .workflow-system/runtime/dist/cli.js
  package_manifest: .workflow-system/runtime/package.json
  lockfile: .workflow-system/runtime/package-lock.json
  package_name: vibe-coding-vnext-runtime
  package_version: 0.14.5
  node_min_version: ">=20.0.0"

proposal:
  schema_version: 1
  kind: vnext-runtime-proposal
  caller:
    - execute-step
    - prepare-task
    - task-lifecycle
    - capture-work-item
    - close-task
  operation_kinds:
    - task-state-transaction
    - finding-queue-transaction
    - lifecycle-transaction
    - inbox-record-transaction
    - project-status-transaction
    - archive-transaction
    - lesson-record-transaction
    - contract-candidate-commit
    - decision-record-transaction
  source_tuple:
    - path
    - revision
    - document_id
    - task_id
    - task_slug
    - workflow_status
    - lifecycle_state
    - active_step_id
    - active_step_status
    - finding_queue_revision
    - resume_requires_review
    - resume_review_reasons
  required_envelope:
    - authority_evidence
    - semantic_delta
    - preconditions
    - evidence_refs
    - idempotency_key
    - requested_write_targets
  finding_queue_admission:
    required:
      - cycle_phase
      - finding_admission_wave_id
  finding_queue_repair:
    required:
      - review_cycle_id
      - repair_wave_id
  task_state:
    actions:
      - step-progress
      - clear-resume-review-gate
      - create-draft
      - update-draft
      - confirm-draft
      - mark-replan-blocked
      - clear-replan-block
      - commit-replan
    step_progress:
      required:
        - step_id
        - status
        - evidence_refs
      optional:
        - note
        - repair_fingerprint
        - diff_target
        - review_receipt
    advancement_outcomes:
      - not-applicable
      - repair-awaiting-verification
      - advanced
      - task-complete
    review_receipt:
      required:
        - cycle_id
        - cycle_phase
        - diff_target
        - diff_target_verification
        - verdict
        - admitted_fingerprints
        - evidence_refs
      verdict: clean
      cycle_phase:
        - discovery
        - verification
      target_verification:
        - verified
        - harness-supplied
    draft:
      mode: default
      actions:
        - create-draft
        - update-draft
      identity_required:
        - task_id
        - task_slug
        - document_id
        - task_title
      definition_required:
        - background_context
        - acceptance
        - allowed_scope
        - conditional_scope
        - forbidden_scope
        - affected_contracts
        - confirmed_decisions
        - open_questions
        - implementation_plan
        - implementation_steps
        - regression_checks
        - rollback_points
        - design_constraints
        - post_release_validation
        - propagation_governance
      create_from: closed + archived
      update_from: draft + active
      target: draft + active
      previous_close_reconciliation:
        archive: required
        status: required
        admitted_lesson: required-or-durable-reuse-proof
      step_admission:
        all_steps_metadata_complete: true
        active_step: first-admitted-step
      preserves:
        - TASK_ID
        - TASK_SLUG
        - document_id on update
        - execution_log
        - applied_proposals
        - canonical provenance
    confirm:
      mode: confirm
      action: confirm-draft
      required:
        - task_id
        - task_slug
        - document_id
        - draft_revision
        - evidence_refs
      authority:
        - user-confirmation
        - authorized-caller
      authority_coordinates:
        required:
          - task_id
          - document_id
          - draft_revision
        exact_draft_revision: true
      from: draft + active
      to: active + active
  prepare_task:
    bound_actions:
      - clear-resume-review-gate
      - create-draft
      - update-draft
      - confirm-draft
      - mark-replan-blocked
      - clear-replan-block
      - commit-replan
    draft_mode: default
    draft_actions:
      - create-draft
      - update-draft
    confirm_mode: confirm
    confirm_actions:
      - confirm-draft
    replan_mode: replan
    replan_actions:
      - mark-replan-blocked
      - clear-replan-block
      - commit-replan
  inbox_record:
    mode: default
    action: record
    required:
      - item_slug
      - record
      - relation_evidence_refs
      - duplicate_check
      - proposed_owner
      - target_path
      - evidence_refs
    record_fields:
      - artifact_kind
      - item_id
      - title
      - type
      - source
      - captured_at
      - relation_to_current_task
      - current_task_id
      - description
      - evidence
      - suggested_next_action
      - status
    relation: unrelated
    duplicate_check: clear
    proposed_owner:
      - triage_later
      - ask_user
    target_pattern: TASKS/inbox/INBOX-<YYYYMMDD>-<short-id>-<slug>.md
    provenance_fields:
      - idempotency_key
      - proposal_digest
      - source_revision
      - source_task_id
      - source_task_slug
      - source_document_id
      - relation_evidence_refs
      - duplicate_check
      - proposed_owner
  lifecycle:
    modes:
      - pause
      - interrupt
      - resume-paused
      - resume-interrupted
      - supersede
    bound_modes:
      - pause
      - interrupt
      - resume-paused
      - resume-interrupted
      - supersede
    proposal_only_modes: []
    pause_required:
      required:
        - lifecycle_state
        - suspension_reason
        - task_start_base
        - last_reviewed_checkpoint
        - current_diff_review_target
        - rollback_conditions
        - resume_review_reasons
        - evidence_refs
    interrupt_required:
      required:
        - lifecycle_state
        - suspension_reason
        - task_start_base
        - last_reviewed_checkpoint
        - current_diff_review_target
        - rollback_conditions
        - resume_review_reasons
        - checkpoint_evidence
        - dirty_attribution
        - environment_state
        - recovery_strategy
        - evidence_refs
    resume_required:
      required:
        - artifact_kind
        - recovery_package_path
        - recovery_package_revision
        - resume_review_reasons
        - evidence_refs
    supersede_required:
      required:
        - invalidation_kind
        - invalidation_reason
        - evidence_refs
        - partial_diff_disposition
  close_task:
    default_mode: default
    preview_mode: preview
    terminal_from:
      - active + active
    terminal_to:
      - closed + archived
    lesson_admission:
      - admit
      - defer
      - no-op
    knowledge_admission:
      dispositions:
        - admit
        - merge
        - supersede
        - defer
        - reject
        - no-op
      durable_dispositions:
        - admit
        - merge
        - supersede
      candidate_fields:
        - candidateId
        - kind
        - fingerprint
        - statement
        - sourceRefs
        - applicability
        - authoritySource
        - stability
        - evidenceRefs
        - noveltyAgainst
        - conflictSet
        - supersedes
        - reviewOrExpiryTrigger
        - expectedConsumers
        - decisionContext
        - systemicSeverity
        - implementation_anchors
      implementation_anchors:
        coverage:
          - observed
          - verified-scope
        max_anchors: 5
        line_number_locators: forbidden
        missing_symbol_behavior: live-search-fallback
      reentry_source: canonical-task-archive-admission
  lesson_marker:
    contract: vnext-lesson-marker/canonical-v1
    marker_version_field: absent
    noncanonical_behavior: fail-closed
    persisted:
      fields:
        - task_id
        - task_slug
        - document_id
        - archive_path
        - archive_revision
        - source_revision
        - candidate_ref
        - candidate_digest
        - evidence_refs
      disposition: omitted
    reused:
      fields:
        - task_id
        - task_slug
        - document_id
        - archive_path
        - archive_revision
        - source_revision
        - candidate_ref
        - candidate_digest
        - evidence_refs
        - disposition
        - reused_candidate
      disposition: reused
      reused_candidate_fields:
        - task_id
        - document_id
        - archive_revision
        - candidate_ref

mutation_scope:
  status: bound
  binding: vnext-runtime-read-only
  source: CURRENT_TASK.md
  buckets:
    - Allowed Files
    - Conditional Files
    - Forbidden Files
  default_write_policy: deny
  read_discovery_is_not_write_authority: true
  ordinary_write_scope: exact-file-or-file-plus-symbol
  broad_glob_requires: inherently-broad-transformation
  conditional_expansion_requires: evidence-and-authority
  changed_goal_scope_acceptance: supersede-or-replan
  check_command: scope-check
  input:
    required:
      - explicit_changed_paths
      - conditional_authorizations_with_evidence_and_authority
      - transformation_kind
  output:
    required:
      - per-path-admission-and-blocker
      - separate-read-discovery-match
      - source-revision

canonical_current_task:
  frontmatter:
    schema_version: 1
    kind: vnext-current-task
    required:
      - document_id
      - runtime_state
  runtime_state:
    schema_version: 1
    kind: vnext-current-task-runtime-state
    fields:
      - task_id
      - task_slug
      - workflow_status
      - lifecycle_state
      - resume_requires_review
      - resume_review_reasons
      - active_step_id
      - active_step_status
      - finding_queue_revision
      - review_cycle
      - findings
      - execution_log
      - applied_proposals
    review_cycle:
      fields:
        - id
        - cycle_phase
        - repair_round
        - counted_repair_wave_ids
        - active_repair_wave_id
        - verification_new_finding_wave_used
        - verification_new_finding_wave_id
      repair_round_max: 3
      same_repair_wave_counts_once: true
      verification_new_finding_wave_max: 1
  source_of_truth: same-canonical-CURRENT_TASK-document
  legacy_schema_behavior: migration-required

concurrency:
  model: single-authorized-writer
  concurrent_state_changing_writers: forbidden
  stale_detection: source-revision-and-explicit-recovery-package-revision

operations:
  - id: task-state-transaction
    status: bound
    binding: vnext-runtime
    operation: task-state-transaction
    source_targets:
      - CURRENT_TASK.md
    write_targets:
      - CURRENT_TASK.md
    allowed_callers:
      - execute-step
      - prepare-task
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: finding-queue-transaction
    status: bound
    binding: vnext-runtime
    operation: finding-queue-transaction
    source_targets:
      - CURRENT_TASK.md
    write_targets:
      - CURRENT_TASK.md
    allowed_callers:
      - execute-step
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: lifecycle-transaction
    status: bound
    binding: vnext-runtime
    operation: lifecycle-transaction
    source_targets:
      - CURRENT_TASK.md
      - TASKS/paused/**
      - TASKS/interrupted/**
    write_targets:
      - CURRENT_TASK.md
      - TASKS/paused/**
      - TASKS/interrupted/**
    allowed_callers:
      - task-lifecycle
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: inbox-record-transaction
    status: bound
    binding: vnext-runtime
    operation: inbox-record-transaction
    source_targets:
      - CURRENT_TASK.md
      - TASKS/inbox/**
    write_targets:
      - TASKS/inbox/**
    allowed_callers:
      - capture-work-item
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: project-status-transaction
    status: bound
    binding: vnext-runtime
    operation: project-status-transaction
    source_targets:
      - CURRENT_TASK.md
      - STATUS.md
      - TASKS/TASK-<TASK_ID>-<TASK_SLUG>.md
    write_targets:
      - STATUS.md
    allowed_callers:
      - close-task
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: archive-transaction
    status: bound
    binding: vnext-runtime
    operation: archive-transaction
    source_targets:
      - CURRENT_TASK.md
      - TASKS/TASK-<TASK_ID>-<TASK_SLUG>.md
    write_targets:
      - CURRENT_TASK.md
      - TASKS/TASK-<TASK_ID>-<TASK_SLUG>.md
    allowed_callers:
      - close-task
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: lesson-record-transaction
    status: bound
    binding: vnext-runtime
    operation: lesson-record-transaction
    source_targets:
      - CURRENT_TASK.md
      - TASKS/TASK-<TASK_ID>-<TASK_SLUG>.md
      - LESSONS.md
    write_targets:
      - LESSONS.md
    allowed_callers:
      - close-task
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: contract-candidate-commit
    status: bound
    binding: vnext-runtime
    operation: contract-candidate-commit
    source_targets:
      - CURRENT_TASK.md
      - TASKS/TASK-<TASK_ID>-<TASK_SLUG>.md
      - CONTRACTS.md
    write_targets:
      - CONTRACTS.md
    allowed_callers:
      - close-task
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: decision-record-transaction
    status: bound
    binding: vnext-runtime
    operation: decision-record-transaction
    source_targets:
      - CURRENT_TASK.md
      - TASKS/TASK-<TASK_ID>-<TASK_SLUG>.md
      - DECISIONS.md
    write_targets:
      - DECISIONS.md
    allowed_callers:
      - close-task
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

unbound_operations: []

bootstrap_project:
  schema_version: 1
  kind: vnext-bootstrap-runtime-contract
  caller:
    - bootstrap-project
  modes:
    - design
    - greenfield
    - inventory
    - adopt
    - realign
  required_envelope:
    - authority_evidence
    - semantic_operations
    - preconditions
    - evidence_refs
    - idempotency_key
    - requested_write_targets
    - requested_directory_targets
    - changed_paths
    - scope_document
    - conditional_authorizations
    - transformation_kind
    - assets
  mutation_scope:
    status: bound
    binding: vnext-runtime-read-only
    source: bootstrap proposal.scope_document
    default_write_policy: deny
    conditional_expansion_requires: evidence-and-authority
    read_discovery_is_not_write_authority: true
    check_command: shared-mutation-scope-evaluator
    input:
      required:
        - explicit_changed_paths
        - conditional_authorizations_with_evidence_and_authority
        - transformation_kind
    output:
      required:
        - per-path-admission-and-blocker
        - source-revision
  asset_boundary:
    allowed_roots:
      - .workflow-system/PROJECT_PROFILE.yaml
      - .workflow-system/vnext/BOOTSTRAP_RECEIPT.json
      - docs/workflow/
      - docs/designs/
      - docs/adoption/
      - AGENTS.md
      - CLAUDE.md
    forbidden_targets:
      - .git/
      - product source directories
      - package manifests at project root
      - native or user-owned host assets
      - .workflow-system/WORKFLOW_PROTOCOL.md
      - .workflow-system/FILE_SCHEMAS.md
      - .workflow-system/vnext/SOURCE_CONTRACT.yaml
      - .workflow-system/vnext/RUNTIME_CONTRACT.yaml
      - .workflow-system/vnext/DISTRIBUTION_STATE.json
      - .workflow-system/vnext/DISTRIBUTION_IN_PROGRESS.json
      - .workflow-system/runtime/**
      - .agents/skills/**
      - paths outside the generated governance set
    generated_categories:
      - config
      - generated
      - governance
  operations:
    - id: contract-candidate-commit
      status: bound
      binding: vnext-runtime
      operation: contract-candidate-commit
      source_targets:
        - source-authority evidence
        - existing CONTRACTS.md when present
      write_targets:
        - CONTRACTS.md
      allowed_callers:
        - bootstrap-project
      result_states:
        - success
        - no-op
        - conflict
        - blocked
      atomic: true
      idempotence: fail-closed
      conflict_policy: fail-closed
    - id: decision-record-transaction
      status: bound
      binding: vnext-runtime
      operation: decision-record-transaction
      source_targets:
        - source-authority evidence
        - existing DECISIONS.md when present
      write_targets:
        - DECISIONS.md
      allowed_callers:
        - bootstrap-project
      result_states:
        - success
        - no-op
        - conflict
        - blocked
      atomic: true
      idempotence: fail-closed
      conflict_policy: fail-closed
    - id: project-status-transaction
      status: bound
      binding: vnext-runtime
      operation: project-status-transaction
      source_targets:
        - STATUS.md
      write_targets:
        - STATUS.md
      allowed_callers:
        - bootstrap-project
      result_states:
        - success
        - no-op
        - conflict
        - blocked
      atomic: true
      idempotence: fail-closed
      conflict_policy: fail-closed
    - id: paired-host-guidance-transaction
      status: bound
      binding: vnext-runtime
      operation: paired-host-guidance-transaction
      source_targets:
        - target host guidance
      write_targets:
        - paired host guidance
      allowed_callers:
        - bootstrap-project
      result_states:
        - success
        - no-op
        - conflict
        - blocked
      atomic: true
      idempotence: fail-closed
      conflict_policy: fail-closed
  recovery:
    marker: .workflow-system/vnext/BOOTSTRAP_IN_PROGRESS.json
    interrupted: fail-closed-explicit-recovery
    rollback: verify-scoped-pre-bootstrap-preimage-before-marker-clear
  read_back:
    required:
      - asset-checksums
      - project-identity
      - runtime-contract
      - distribution-prerequisite
      - canonical-CURRENT_TASK
      - host-isolation
