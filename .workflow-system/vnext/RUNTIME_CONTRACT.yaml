schema_version: 1
kind: vnext-runtime-contract
phase: Phase 2

runtime_distribution:
  kind: project-local-node
  package_path: .workflow-system/runtime
  entrypoint: .workflow-system/runtime/dist/cli.js
  package_manifest: .workflow-system/runtime/package.json
  lockfile: .workflow-system/runtime/package-lock.json
  package_name: vibe-coding-vnext-runtime
  package_version: 0.14.5
  node_min_version: ">=20.0.0"

proposal:
  schema_version: 1
  kind: vnext-runtime-proposal
  caller: execute-step
  operation_kinds:
    - task-state-transaction
    - finding-queue-transaction
  source_tuple:
    - path
    - revision
    - document_id
    - task_id
    - task_slug
    - workflow_status
    - lifecycle_state
    - active_step_id
    - active_step_status
    - finding_queue_revision
  required_envelope:
    - authority_evidence
    - semantic_delta
    - preconditions
    - evidence_refs
    - idempotency_key
    - requested_write_targets
  finding_queue_admission:
    required:
      - cycle_phase
      - finding_admission_wave_id
  finding_queue_repair:
    required:
      - review_cycle_id
      - repair_wave_id

canonical_current_task:
  frontmatter:
    schema_version: 1
    kind: vnext-current-task
    required:
      - document_id
      - runtime_state
  runtime_state:
    schema_version: 1
    kind: vnext-current-task-runtime-state
    fields:
      - task_id
      - task_slug
      - workflow_status
      - lifecycle_state
      - active_step_id
      - active_step_status
      - finding_queue_revision
      - review_cycle
      - findings
      - execution_log
      - applied_proposals
    review_cycle:
      fields:
        - id
        - cycle_phase
        - repair_round
        - counted_repair_wave_ids
        - active_repair_wave_id
        - verification_new_finding_wave_used
        - verification_new_finding_wave_id
      repair_round_max: 3
      same_repair_wave_counts_once: true
      verification_new_finding_wave_max: 1
  source_of_truth: same-canonical-CURRENT_TASK-document
  legacy_schema_behavior: migration-required

concurrency:
  model: single-authorized-writer
  concurrent_state_changing_writers: forbidden
  stale_detection: source-revision

operations:
  - id: task-state-transaction
    status: bound
    binding: vnext-runtime
    operation: task-state-transaction
    source_targets:
      - CURRENT_TASK.md
    write_targets:
      - CURRENT_TASK.md
    allowed_callers:
      - execute-step
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: finding-queue-transaction
    status: bound
    binding: vnext-runtime
    operation: finding-queue-transaction
    source_targets:
      - CURRENT_TASK.md
    write_targets:
      - CURRENT_TASK.md
    allowed_callers:
      - execute-step
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

unbound_operations:
  - lifecycle-transaction
  - inbox-record-transaction
  - project-status-transaction
  - archive-transaction
  - lesson-record-transaction
