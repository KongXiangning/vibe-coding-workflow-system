schema_version: 1
kind: vnext-runtime-contract
phase: Phase 2

runtime_distribution:
  kind: project-local-node
  package_path: .workflow-system/runtime
  entrypoint: .workflow-system/runtime/dist/cli.js
  package_manifest: .workflow-system/runtime/package.json
  lockfile: .workflow-system/runtime/package-lock.json
  package_name: vibe-coding-vnext-runtime
  package_version: 0.14.5
  node_min_version: ">=20.0.0"

proposal:
  schema_version: 1
  kind: vnext-runtime-proposal
  caller:
    - execute-step
    - prepare-task
    - task-lifecycle
    - close-task
  operation_kinds:
    - task-state-transaction
    - finding-queue-transaction
    - lifecycle-transaction
    - project-status-transaction
    - archive-transaction
    - lesson-record-transaction
  source_tuple:
    - path
    - revision
    - document_id
    - task_id
    - task_slug
    - workflow_status
    - lifecycle_state
    - active_step_id
    - active_step_status
    - finding_queue_revision
    - resume_requires_review
    - resume_review_reasons
  required_envelope:
    - authority_evidence
    - semantic_delta
    - preconditions
    - evidence_refs
    - idempotency_key
    - requested_write_targets
  finding_queue_admission:
    required:
      - cycle_phase
      - finding_admission_wave_id
  finding_queue_repair:
    required:
      - review_cycle_id
      - repair_wave_id
  prepare_task:
    bound_actions:
      - clear-resume-review-gate
      - mark-replan-blocked
      - clear-replan-block
      - commit-replan
    replan_mode: replan
    replan_actions:
      - mark-replan-blocked
      - clear-replan-block
      - commit-replan
  lifecycle:
    modes:
      - pause
      - interrupt
      - resume-paused
      - resume-interrupted
      - supersede
    bound_modes:
      - pause
      - interrupt
      - resume-paused
      - resume-interrupted
      - supersede
    proposal_only_modes: []
    pause_required:
      required:
        - lifecycle_state
        - suspension_reason
        - task_start_base
        - last_reviewed_checkpoint
        - current_diff_review_target
        - rollback_conditions
        - resume_review_reasons
        - evidence_refs
    interrupt_required:
      required:
        - lifecycle_state
        - suspension_reason
        - task_start_base
        - last_reviewed_checkpoint
        - current_diff_review_target
        - rollback_conditions
        - resume_review_reasons
        - checkpoint_evidence
        - dirty_attribution
        - environment_state
        - recovery_strategy
        - evidence_refs
    resume_required:
      required:
        - artifact_kind
        - recovery_package_path
        - recovery_package_revision
        - resume_review_reasons
        - evidence_refs
    supersede_required:
      required:
        - invalidation_kind
        - invalidation_reason
        - evidence_refs
        - partial_diff_disposition
  close_task:
    default_mode: default
    preview_mode: preview
    terminal_from:
      - active + active
    terminal_to:
      - closed + archived
    lesson_admission:
      - admit
      - defer
      - no-op

mutation_scope:
  status: bound
  binding: vnext-runtime-read-only
  source: CURRENT_TASK.md
  buckets:
    - Allowed Files
    - Conditional Files
    - Forbidden Files
  default_write_policy: deny
  read_discovery_is_not_write_authority: true
  ordinary_write_scope: exact-file-or-file-plus-symbol
  broad_glob_requires: inherently-broad-transformation
  conditional_expansion_requires: evidence-and-authority
  changed_goal_scope_acceptance: supersede-or-replan
  check_command: scope-check
  input:
    required:
      - explicit_changed_paths
      - conditional_authorizations_with_evidence_and_authority
      - transformation_kind
  output:
    required:
      - per-path-admission-and-blocker
      - separate-read-discovery-match
      - source-revision

canonical_current_task:
  frontmatter:
    schema_version: 1
    kind: vnext-current-task
    required:
      - document_id
      - runtime_state
  runtime_state:
    schema_version: 1
    kind: vnext-current-task-runtime-state
    fields:
      - task_id
      - task_slug
      - workflow_status
      - lifecycle_state
      - resume_requires_review
      - resume_review_reasons
      - active_step_id
      - active_step_status
      - finding_queue_revision
      - review_cycle
      - findings
      - execution_log
      - applied_proposals
    review_cycle:
      fields:
        - id
        - cycle_phase
        - repair_round
        - counted_repair_wave_ids
        - active_repair_wave_id
        - verification_new_finding_wave_used
        - verification_new_finding_wave_id
      repair_round_max: 3
      same_repair_wave_counts_once: true
      verification_new_finding_wave_max: 1
  source_of_truth: same-canonical-CURRENT_TASK-document
  legacy_schema_behavior: migration-required

concurrency:
  model: single-authorized-writer
  concurrent_state_changing_writers: forbidden
  stale_detection: source-revision-and-explicit-recovery-package-revision

operations:
  - id: task-state-transaction
    status: bound
    binding: vnext-runtime
    operation: task-state-transaction
    source_targets:
      - CURRENT_TASK.md
    write_targets:
      - CURRENT_TASK.md
    allowed_callers:
      - execute-step
      - prepare-task
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: finding-queue-transaction
    status: bound
    binding: vnext-runtime
    operation: finding-queue-transaction
    source_targets:
      - CURRENT_TASK.md
    write_targets:
      - CURRENT_TASK.md
    allowed_callers:
      - execute-step
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: lifecycle-transaction
    status: bound
    binding: vnext-runtime
    operation: lifecycle-transaction
    source_targets:
      - CURRENT_TASK.md
      - TASKS/paused/**
      - TASKS/interrupted/**
    write_targets:
      - CURRENT_TASK.md
      - TASKS/paused/**
      - TASKS/interrupted/**
    allowed_callers:
      - task-lifecycle
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: project-status-transaction
    status: bound
    binding: vnext-runtime
    operation: project-status-transaction
    source_targets:
      - CURRENT_TASK.md
      - STATUS.md
      - TASKS/TASK-<TASK_ID>-<TASK_SLUG>.md
    write_targets:
      - STATUS.md
    allowed_callers:
      - close-task
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: archive-transaction
    status: bound
    binding: vnext-runtime
    operation: archive-transaction
    source_targets:
      - CURRENT_TASK.md
      - TASKS/TASK-<TASK_ID>-<TASK_SLUG>.md
    write_targets:
      - CURRENT_TASK.md
      - TASKS/TASK-<TASK_ID>-<TASK_SLUG>.md
    allowed_callers:
      - close-task
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

  - id: lesson-record-transaction
    status: bound
    binding: vnext-runtime
    operation: lesson-record-transaction
    source_targets:
      - CURRENT_TASK.md
      - TASKS/TASK-<TASK_ID>-<TASK_SLUG>.md
      - LESSONS.md
    write_targets:
      - LESSONS.md
    allowed_callers:
      - close-task
    result_states:
      - success
      - no-op
      - conflict
      - blocked
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed

unbound_operations:
  - inbox-record-transaction
