# All public entries use the internal run-entry driver for typed operations.
# entry-operation-result/v1 carries invocation, recovery history and original
# outcome; recovery-required is an agent continuation, not a user-facing terminal.
# entry-recovery/v1: a rejected operation is owned by the invoking Skill's internal
# recovery loop; the rejection alone is not a terminal Skill outcome. Coded errors
# carry guidance without converting failure into success or claiming a commit.
# Attempt budgets retain history. Existing invocation authority may support a
# typed continuation after AI reassessment; admitted attempts are not charged twice.
# Admitted validation replacement / confirmed evidence amendment also admits its
# necessary revalidation capacity in that transaction, preserving prior attempts.
schema_version: 1
# Shared transaction responses expose the evidence ceiling, not proof of execution.
# Transaction result field: evidence_assurance: caller-reported.
kind: vnext-runtime-contract
phase: Phase 2

runtime_distribution:
  kind: project-local-node
  package_path: .workflow-system/runtime
  entrypoint: .workflow-system/runtime/dist/cli.js
  package_manifest: .workflow-system/runtime/package.json
  lockfile: .workflow-system/runtime/package-lock.json
  package_name: vibe-coding-vnext-runtime
  package_version: 0.21.2
  node_min_version: ">=20.0.0"

task_context:
  schema_version: 1
  kind: vnext-task-context-contract
  commands:
    - task-context
    - task-read
    - task-storage-migration
    - task-export
  entry_points:
    - validate --summary
    - task-context
    - task-read
    - review-context
    - review-read
    - preflight-step
    - evidence-context
  views:
    - overview
    - operation-context
    - history-on-demand
  projection:
    default: task-context
    required_blocks:
      - current-definition-or-visible-definition-revision
      - current-step
      - mutation-authority
      - unfinished-obligations
      - required-dependencies
      - unknown-dependencies
      - global-gates
      - latest-execution
    review_requires_cumulative_target: true
    forbidden_expansions:
      - raw-runtime-state
      - unbounded-execution-log
      - unbounded-applied-proposals
  paging:
    unit: utf8-bytes
    default_bytes: 16384
    min_bytes: 256
    max_bytes: 65536
    required_fields:
      - returned
      - total_bytes
      - continuation
      - complete_for_operation
    stale_binding:
      - source_revision
      - definition_revision
      - state_revision
      - exact_reference
  receipts:
    context: task-context-receipt/v1
    read: task-read-receipt/v1
    proves: version-and-return-range-only
    not_authority: true
  read_only: true

task_store:
  schema_version: 1
  kind: vnext-task-store-contract
  # v3 is a lossless active projection of this same aggregate. Existing inline
  # and compact-v2 tasks remain readable until explicit storage migration.
  root: <workflow_home>/task-data/<document_id>
  objects: objects/<sha256>.json
  events: events/<sequence>-<sha256>.json
  indexes: rebuildable-and-non-authoritative
  commit_head: CURRENT_TASK-single-submission-head
  hot_window: cache-only
  full_history: persistent-and-queryable
  dedup_key: schema-object-type-document-id-complete-content
  event_identity: sequence-time-cause-and-idempotency-preserved
  migration: preview-confirm-commit-with-source-revision
  garbage_collection: disabled-in-v1
  target_owned_data: task-data-is-never-removed-by-distribution-upgrade
  active_projection:
    format: compact-v3
    canonical_roots: CURRENT_TASK-definition-state-and-acknowledged-manifest
    material: immutable-content-addressed-definition-state-reports
    history: preserve-exact-preimages-events-and-idempotency
    legacy: read-without-rewrite-and-explicit-storage-migration
    admission: no-size-quota-or-business-transition
    receipt_continuity: committed-storage-only-lineage-and-equal-logical-state
    wire_compatibility: frozen-v3-model-not-current-serializer-bytes
  diagnostics:
    response: validate --summary/storage_metrics
    kind: task-storage-metrics/v1
    read_only: true
    authority: none
    persistence: none
    incomplete: null-with-reason-not-a-gate

proposal:
  schema_version: 1
  kind: vnext-runtime-proposal
  caller:
    - execute-step
    - review-change
    - prepare-task
    - task-lifecycle
    - capture-work-item
    - close-task
  operation_kinds:
    - task-state-transaction
    - finding-queue-transaction
    - user-decision-transaction
    - lifecycle-transaction
    - inbox-record-transaction
    - project-status-transaction
    - archive-transaction
    - lesson-record-transaction
    - contract-candidate-commit
    - decision-record-transaction
  source_tuple:
    - path
    - revision
    - document_id
    - task_id
    - task_slug
    - workflow_status
    - lifecycle_state
    - active_step_id
    - active_step_status
    - finding_queue_revision
    - resume_requires_review
    - resume_review_reasons
  required_envelope:
    - authority_evidence
    - semantic_delta
    - preconditions
    - evidence_refs
    - idempotency_key
    - requested_write_targets
  finding_queue_admission:
    required:
      - cycle_phase
      - finding_admission_wave_id
  finding_queue_repair:
    required:
      - review_cycle_id
      - repair_wave_id
  process_control:
    user_decision: atomic-task-bound-decision; preserve-verbatim-source-and-history; repair-defer-reject-accept-risk-reopen-exception-advance-and-exact-mutation-authorization; never-rewrite-findings-or-failures-as-clean; exact-source-revision-review-change-set-and-idempotency-binding; replay-is-no-op
    evidence_plan_amendment: prepare-confirm-discard-evidence-plan-amendment; explicit-user; same-task-no-challenge-required; preserve-goal-acceptance-authority-findings-history-budgets; fresh-checks-and-affected-review-revalidation; unbound-planned-read-only-command-scope-correction-without-slot-or-waiver
    user_evidence: exact-frozen-slot-and-subject; append-verbatim-Task-Basis; caller-reported-not-authenticated
    waiver: user-owned-current-obligation-only; preserve-failed-or-missing-report; exact-result-waiver-decision-id; validation-labels-require-exclusive-frozen-check-ownership-at-record-and-consume; no-review-or-policy-bypass
    successor: explicit-predecessor-decision-and-complete-obligation-map; fresh-draft-identity; predecessor-remains-superseded; exact-prepared-orphan-retry-only; ordinary-confirmation-required
    validation_adjustment: replace-validation; one-read-only-check; preserve-observation-boundary-subjects-validation-ownership-exact-granularity-selector-authority-and-budgets; no-task-redefinition
    policy_gate_routing:
      commands:
        - record-user-decision
        - prepare-task:amend-scope
      codes:
        - CONTROLLED_RECOVERY_LIMIT
        - RETRY_BUDGET_EXHAUSTED
        - RETRY_REVIEW_REQUIRED
        - REPAIR_BUDGET_EXHAUSTED
        - NEW_FINDING_WAVE_BUDGET_EXHAUSTED
        - PENDING_REVIEW_REQUIRED
        - REVIEW_CONVERGENCE_REQUIRED
        - DYNAMIC_REVIEW_REQUIRED
        - REVIEW_CHECKPOINT_REQUIRED
        - REVIEW_EXECUTION_REQUIRED
        - REVIEW_VERIFICATION_REQUIRED
        - REVIEW_PHASE_INVALID
        - CLAIM_EVIDENCE_INCOMPLETE
        - CLAIM_EVIDENCE_REQUIRED
        - CLAIM_EVIDENCE_ACCEPTANCE_REQUIRED
        - EVIDENCE_CHALLENGE_UNRESOLVED
        - TEST_STRATEGY_SEQUENCE_INVALID
        - MUTATION_BLAST_RADIUS_ASSESSMENT_REQUIRED
        - MUTATION_AUTHORITY_EXPANSION_REQUIRED
      integrity_boundary: fact-identity-revision-receipt-and-target-conflicts-remain-hard-rejects
      task_context_next_entry: must-resolve-to-a-declared-runtime-command
  task_state:
    actions:
      - retry-step
      - reconcile-preflight
      - record-step-preflight
      - extend-preflight
      - step-progress
      - consume-retained-review
      - record-user-evidence
      - clear-resume-review-gate
      - extend-repair-budget
      - authorize-controlled-repair-recovery
      - create-draft
      - update-draft
      - confirm-draft
      - migrate-claim-evidence
      - record-review-result
      - record-evidence-challenge
      - dismiss-evidence-challenge
      - mark-replan-blocked
      - clear-replan-block
      - commit-replan
      - commit-scope-amendment
    execution_admission:
      evaluator: runtime-owned-exact-target-admission/v1
      question: current-task-step-phase-target-assessment-may-enter-this-execution
      shared_by:
        - record-step-preflight
        - extend-preflight
        - begin-repair
        - repair-extension
        - record-step-result
        - command-footprint-preflight
      classifications:
        - planned-admitted
        - dynamic-self-admitted
        - persistent-test-admitted
        - blocked-authority
        - blocked-assessment
        - blocked-test-strategy
        - blocked-persistent-test
        - blocked-non-executable-policy
        - blocked-governance
      mutation_order:
        - explicit-forbidden-and-governance
        - test-strategy-and-non-executable-policy
        - v1-or-v2-authority
        - assessment-and-persistent-test-admission
      error_mapping:
        blocked_assessment: MUTATION_BLAST_RADIUS_ASSESSMENT_REQUIRED
        blocked_escalation: MUTATION_BLAST_RADIUS_ESCALATION_REQUIRED
        blocked_authority: MUTATION_AUTHORITY_EXPANSION_REQUIRED
      semantic_boundary: runtime-owns-structural-checks-agent-owns-blast-radius-judgment
    retry_step:
      max_attempts: 3 # ordinary warning threshold; exact user decisions may authorize continuation
      environment_report: environment-restored/v1
      same_plan_repair_diagnosis: same-plan-repair/v1
      repair_paths: current-authority-admitted-and-fresh-preflight
      failure_preservation: durable-step-attempts
      result_required: fresh-preflight-and-execution
    step_progress:
      required:
        - step_id
        - status
        - evidence_refs
      optional:
        - note
        - repair_fingerprint
        - repair_fingerprints
        - repair_wave_id
        - controlled_recovery_grant_id
        - policy_decision_id
        - change_set_id
        - review_receipt
        - claim_evidence
        - execution_result
    preflight:
      initial:
        action: record-step-preflight
        planned_footprint: normal-admission
        in_envelope_unplanned: blast-radius-assessment-and-self-admit
        outside_envelope: MUTATION_AUTHORITY_EXPANSION_REQUIRED
        first_touch: runtime-captured-before-state
        evaluator: execution-admission
        execution_identity: stable-per-execution-with-replacement-receipt
      extension:
        action: extend-preflight
        required:
          - current_preflight_id
          - additional_targets
          - blast_radius_assessments
          - evidence_refs
        optional:
          - mode
          - execution_id
          - execution_phase
          - repair_wave_id
          - review_id
          - controlled_recovery_grant_id
          - policy_decision_id
        same_attempt: true
        plan_revision_change: forbidden
        retry_budget_change: forbidden
        continuation: forbidden
        replacement_receipt: required
        review: risk-selected-cumulative-review-for-self-admitted-expansion
        repair: same-evaluator-same-wave-no-retry-consumption
        first_touch: append-only-for-new-targets
      reconciliation:
        action: reconcile-preflight
        required:
          - step_id
          - current_preflight_id
          - mode
          - execution_disposition
          - decision_source
          - decision_text
          - evidence_refs
        dispositions:
          - not-started
          - started-unknown
        preserves:
          - logical-attempt-count
          - execution-history
          - pending-review
          - findings
          - repair-and-retry-budgets
          - source-and-review-bindings
        next: fresh-preflight-after-explicit-caller-disposition
    claim_evidence:
      stored_in: canonical CURRENT_TASK.runtime_state
      report_binding: exact-claim-slot-check-only; command pass never creates or satisfies another slot
      record_fields:
        - claim_id
        - claim_kind
        - requirement
        - source_ref
        - slots
      slot_fields:
        - slot_id
        - minimum_type
        - disposition
        - evidence_refs
        - due_step_id
        - applicability
        - before_step_id
        - check
        - report
        - prerequisite_receipt
        - user_decision
      complete_dispositions:
        - existing
        - reused
        - newly-executed
      incomplete_dispositions:
        - missing
        - deferred
        - blocked
      execution_selection:
        invocation_kinds:
          - structured
          - opaque
        fields:
          - granularity
          - selector
          - selection_reason
          - breadth_reason
          - breadth_basis
          - breadth_source_ref
          - invocation
        check_boundaries:
          - local
          - business-flow
          - e2e
        granularities:
          - focused
          - target
          - broad-regression
        breadth_bases:
          - claim-risk-contract
          - acceptance-boundary
          - low-cost-evidence-insufficient
          - project-policy
          - release-gate
          - explicit-user
        freshness: new-or-changed-check-identity-across-draft-update-confirm-replan-recovery; unchanged-confirmed-legacy-compatible
        command_binding: structured-argv-selector-or-verbatim-opaque-command-equals-entry-and-exact-due-step-planned-command; opaque-cannot-claim-focused
        business_flow: per-check-boundary-independent-of-granularity; same-claim-rule-and-flow-slots; no-test-type-hierarchy
        authority_binding: explicit-user-exact-task-basis; policy-and-release-canonical-repository-source; claim-bases-exact-current-claim-and-its-existing-task-basis-or-repository-source
        e2e_admission: acceptance-boundary-or-low-cost-insufficiency-or-project-policy-or-release-gate-or-explicit-user
        broad_admission: claim-risk-contract-or-project-policy-or-release-gate-or-explicit-user
      completion_rule: non-empty acceptance-bearing frozen plan; due slots require bound successful reports or exact applicable user waivers; waivers never imply PASS; close checks all slots and consumed prerequisites
    claim_evidence_migration:
      mode: default
      action: migrate-claim-evidence
      required:
        - claim_evidence
        - evidence_refs
      from: active + active legacy-or-empty-plan
      to: active + active
      mutation: reconstruct legacy claim/slot/check identities; execution entries must equal existing planned commands at their original due steps; modern selection metadata is not required
      preserves:
        - TASK_ID
        - TASK_SLUG
        - document_id
        - goal
        - scope
        - acceptance
        - implementation steps
        - active step/status
        - execution history
        - findings
        - review state
        - lifecycle tuple
    advancement_outcomes:
      - not-applicable
      - repair-awaiting-verification
      - advanced
      - task-complete
    review_receipt:
      required:
        - cycle_id
        - cycle_phase
        - change_set_id
        - review_target_revision
        - verdict
        - admitted_fingerprints
        - evidence_refs
      optional:
        - completion_disposition
        - user_decision_id
      verdict: clean-or-disposition; disposition-requires-user-directed-with-exceptions-and-user-decision-id
      cycle_phase:
        - discovery
        - verification
      target_verification: runtime-file-manifest
    review_result:
      test_assessment: [applicable, reason, evidence_refs, necessity, oracle, boundary, reuse, applicability]
      stored_in: canonical CURRENT_TASK.runtime_state.pending_review_result
      verdicts:
        - clean
        - findings
        - blocked
      binds:
        - active_step_id
        - review_cycle_id
        - latest_execution_id
        - change_set_id
        - review_target_revision
      blocked_diagnostics:
        - findings
        - unresolved_fingerprints
        - resolved_fingerprints
        - finding_dispositions
        - blocker
      consumed_by:
        clean: execute-step:complete-reviewed-step
        findings: execute-step:begin-repair
        blocked: record-user-decision-or-caller-route
    draft:
      mode: default
      actions:
        - create-draft
        - update-draft
      identity_required:
        - task_id
        - task_slug
        - document_id
        - task_title
      definition_required:
        - background_context
        - acceptance
        - allowed_scope
        - conditional_scope
        - forbidden_scope
        - affected_contracts
        - confirmed_decisions
        - open_questions
        - implementation_plan
        - implementation_steps
        - regression_checks
        - rollback_points
        - design_constraints
        - post_release_validation
        - propagation_governance
      claim_evidence: required-and-non-empty-for-new-or-refined-drafts; must-include-an-acceptance-claim; legacy-documents-remain-readable-but-require-migration-before-terminal-completion
      task_basis:
        required:
          - original_request
          - user_decisions
        source_fields:
          - source
          - verbatim
        storage: identity-derived-linked-document
        write_binding: same-atomic-draft-transaction
        review_results_forbidden: true
      create_from: closed + archived
      update_from: draft + active
      target: draft + active
      previous_close_reconciliation:
        archive: required
        status: non-blocking
        admitted_lesson: required-or-durable-reuse-proof
      step_admission:
        all_steps_metadata_complete: true
        active_step: first-admitted-step
      preserves:
        - TASK_ID
        - TASK_SLUG
        - document_id on update
        - execution_log
        - applied_proposals
        - canonical provenance
    confirm:
      mode: confirm
      action: confirm-draft
      required:
        - task_id
        - task_slug
        - document_id
        - draft_revision
        - evidence_refs
      authority:
        - user-confirmation
        - authorized-caller
      authority_coordinates:
        required:
          - task_id
          - document_id
          - draft_revision
        exact_draft_revision: true
      from: draft + active
      to: active + active
  execute_step:
    semantic_adapter:
      input: stdin-json
      commands:
        - preflight-step
        - resume-preflight
        - reconcile-preflight
        - extend-preflight
        - evidence-context
        - retry-step
        - replace-validation
        - begin-repair
        - record-step-result
        - complete-reviewed-step
      step_source: confirmed-current-task
      scope_enforcement: task-authority-envelope-with-v1-step-compatibility
      command_plan_source: confirmed-current-step
      persistent_tests_enforcement: frozen-section-plus-authority-evaluator-existing-test-distinction
      test_strategy_execution:
        phase_source: versioned-frozen-test-strategy-and-current-step-evidence-obligation
        legacy_behavior: read-history-block-unversioned-execution
        test_first:
          first_step_phase: test-first
          later_step_phase: test-first
          first_step_outcome: implemented
          later_step_outcome: implemented
          advancement_gate: runtime-consumed-bound-prerequisite-evidence
        red_evidence:
          result_status: expected-failure
          kind: behavior-not-implemented
          companion_statuses:
            - passed
          forbidden_statuses:
            - failed
            - blocked
            - not-run
          acceptance_evidence: positive-forbidden-bound-reproduction-required
          unexpected_failure_outcome: blocked
          review_checkpoint: required
        non_red_outcome: implemented-with-passed-results-or-bound-reproduction
      completion_evidence_source: recorded-step-result-only
      change_detection: runtime-preflight-candidate-before-after-delta
      proposal_file_policy: project-external-only
      advancement_owner: runtime
      post_completion_commit_owner: user-or-explicit-outer-orchestrator
      post_completion_route: git-commit
    bound_actions:
      - admit
      - retry-step
      - reconcile-preflight
      - record-step-preflight
      - extend-preflight
      - step-progress
      - record-repair-attempt
      - resolve
  review_change:
    semantic_adapter:
      input: stdin-json
      commands:
        - review-context
        - review-read
        - record-review-result
        - record-evidence-challenge
        - dismiss-evidence-challenge
      context_source: latest-recorded-execution
      reviewable_execution: implemented-or-test-red-awaiting-required-checkpoint-or-dynamic-review-or-repair-verification-or-blocked-repair-remediation-review
      change_set: runtime-owned-stable-id
      review_target: runtime-cumulative-before-after-file-delta
      result_storage: canonical-pending-review-result
      direct_product_writes: deny
      advancement_owner: execute-step
    bound_actions:
      - record-review-result
      - record-evidence-challenge
      - dismiss-evidence-challenge
  prepare_task:
    semantic_adapter:
      input: stdin-json
      commands:
        - prepare-draft
        - prepare-successor
        - record-human-acceptance
        - record-evidence-waiver
        - confirm-draft
        - clear-resume-review
        - extend-repair-budget
        - authorize-controlled-repair-recovery
        - replan
        - prepare-replan
        - confirm-replan
        - discard-replan
        - prepare-scope-amendment
        - discard-scope-amendment
        - initialize-preservation
      draft_fields:
        - task_basis
        - goal
        - acceptance
        - out_of_scope
        - design_decisions
        - mutation_authority_version
        - mutation_authority
        - planned_mutation_targets
        - test_strategy
        - implementation_steps
        - validation_plan
        - persistent_tests
      optional_draft_fields:
        - project_documents
        - affected_contracts
      decision_partition:
        decided: confirmed_decisions
        unresolved: open_questions
      task_basis_storage: linked-TASK_BASIS-with-path-and-revision
      command_footprint_preflight:
        source: "implementation_steps[].commands"
        fields:
          - command
          - expected_repo_writes
        evaluator: shared-mutation-scope-evaluator-and-v2-authority-evaluator
        timing: before-draft-commit
      confirmation_binding: runtime-issued-draft-receipt-plus-authorized-caller
      resume_review_binding: caller-provided-exact-readiness-receipt
      replan_entry: blocked-pending-confirmed-candidate
      test_strategy:
        storage: current-task-regression-checks/test-strategy
        fields:
          - mode
          - source
          - source_ref
          - task_classification
          - rationale
        modes:
          - flexible
          - test-first
          - implementation-first
          - not-applicable
        sources:
          - explicit-user
          - project-policy
          - inferred-default
        classifications:
          - contract-clear-behavior
          - exploratory-or-infrastructure
          - non-executable-change
        source_binding:
          explicit-user: exact-task-basis-source-coordinate
          project-policy: existing-project-policy-file
          inferred-default: prepare-task-default
        precedence:
          - explicit-user
          - project-policy
          - inferred-default
        ambiguity: resolve-as-open-question-before-draft-commit
        frozen_by: confirm-draft
        change_after_confirm: replan-only
        enforcement: create-update-confirm-and-replan
        ordering_enforcement: runtime-consumed-before-step-slots
        non_executable_scope:
          policy_source: .workflow-system/PROJECT_PROFILE.yaml#boundaries.non_executable_change_paths
          required_for: not-applicable
          evaluated_surfaces:
            - task-allowed-scope
            - task-conditional-scope
            - implementation-step-mutation-scope
          policy_pattern_grammar: exact-path-or-literal-directory-prefix-globstar
          relation: exact-or-proven-subset
          missing_or_ambiguous: block-not-applicable-only
          historical_active_tasks: not-revalidated
          error_codes:
            - TEST_STRATEGY_NON_EXECUTABLE_UNPROVEN
            - TEST_STRATEGY_NON_EXECUTABLE_SCOPE_VIOLATION
      persistent_tests_storage: existing-scope-and-regression-sections
      persistent_tests_enforcement: frozen-section-plus-authority-evaluator-existing-test-distinction
      proposal_file_policy: project-external-only
      internal_action_owners:
        migrate-claim-evidence: runtime-compatibility
        mark-replan-blocked: runtime-convergence
        clear-replan-block: runtime-convergence
    bound_actions:
      - record-user-evidence
      - clear-resume-review-gate
      - extend-repair-budget
      - authorize-controlled-repair-recovery
      - create-draft
      - update-draft
      - confirm-draft
      - migrate-claim-evidence
      - mark-replan-blocked
      - clear-replan-block
      - commit-scope-amendment
    draft_mode: default
    draft_actions:
      - create-draft
      - update-draft
    confirm_mode: confirm
    confirm_actions:
      - confirm-draft
    migration_mode: default
    migration_actions:
      - migrate-claim-evidence
    replan_mode: replan
    replan_actions:
      - mark-replan-blocked
      - clear-replan-block
      - commit-replan
    scope_amendment_mode: amend-scope
    scope_amendment_actions:
      - commit-scope-amendment
    scope_amendment_authorization:
      source: record-user-decision
      effect: authorize-mutation
      binding: current-pending-review-id-and-change-set-id
      persisted_in:
        - scope-amendment-candidate
        - scope-amendment-candidate-receipt
