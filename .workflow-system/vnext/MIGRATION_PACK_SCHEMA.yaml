schema_version: 1
kind: workflow-vnext-migration-pack-schema
status: contract

# This file is the machine-readable boundary for the one-time migration
# tool.  It is not a vNext Runtime schema and is never installed as a legacy
# compatibility surface.
pack:
  manifest_file: migration-pack.json
  artifact_directory: artifacts/
  original_directory: originals/
  required_fields:
    - schema_version
    - kind
    - pack_id
    - status
    - source
    - target
    - legacy_source
    - legacy_protocol
    - preflight
    - conversion
    - artifacts
    - legacy_surface
    - installation
  schema_version: 3
  supported_read_versions: [1, 2, 3]
  optional_fields: [decisions]
  v3_required_fields: [alignment_context]
  alignment_context: [host_files, workflow_documents]
  status: validated
  conversion:
    mode: offline-structural
    preserves_original_text: true
    semantic_reinterpretation: false
    canonical_document_schema_version: 1
    conversion_rule: canonical-verbatim-v2
    historical_body: exact-original-bytes
    current_projection: explicit-original_text_preserved-false-with-backup
    historical_read_rules: [canonical-envelope-v1]
  current_task:
    precondition_only: true
    required_state: archived/archived-or-explicit-completed-historical-decision
    raw_backup: TASKS/legacy/CURRENT_TASK-<sha256>.md
    paused_policy: explicitly-declared-files-preserved-verbatim-not-resumable
    excluded_from_artifacts: true
  replay_identity:
    - source.root_identity
    - source.revision
    - source.tree_hash
    - target.root_identity
    - legacy_source.revision
    - legacy_source.tree_hash
    - pack_id

artifact:
  required_fields:
    - stable_id
    - kind
    - source_path
    - target_path
    - content_path
    - original_content_path
    - canonical_schema_version
    - conversion_rule
    - source_sha256
    - content_sha256
    - byte_length
    - path_references
    - provenance
  stable_id: artifact-<24 lowercase hex>
  conversion_rule: canonical-verbatim-v2
  historical_read_rules: [canonical-envelope-v1]
  current_projection_optional_field: original_backup_path
  current_projection_sources:
    - AGENTS.md
    - CLAUDE.md
    - package.json
    - .workflow-system/PROJECT_PROFILE.yaml
    - docs/workflow/WORKFLOW_GUIDE.md
    - docs/workflow/DOCUMENT_CATALOG.md
    - docs/workflow/STATUS.md
  original_backup: .workflow-system/legacy/<sha256>/<source-path>
  host_guidance: workflow-system-sections-only-existing-files
  legacy_skill_directories: [.agents/skills/workflow-system-*, .codex/skills/workflow-system-*, .claude/skills/workflow-system-*]
  original_content_path: originals/<stable-id>.source
  canonical_document: frontmatter-or-vnext-profile-extension
  auxiliary_projection_exception: existing-host-guidance-and-package-json-remain-native-format
  projection_indexes: current-projected-body
  source_indexes: artifact-path-references-retain-original-source-inventory
  canonical_frontmatter_fields:
    - schema_version
    - kind
    - document_kind
    - document_id
    - source_path
    - source_sha256
    - legacy_source_revision
    - legacy_source_tree_hash
    - legacy_protocol_version
    - conversion_rule
    - original_text_preserved
    - heading_index
    - path_references
  canonical_profile_extension_fields:
    - schema_version
    - kind
    - document_id
    - source_path
    - source_sha256
    - legacy_source_revision
    - legacy_source_tree_hash
    - legacy_protocol_version
    - conversion_rule
    - original_text_preserved
    - path_references
  provenance:
    - source.revision
    - source.tree_hash
    - legacy_source.revision
    - legacy_source.tree_hash
  allowed_kinds:
    - governance-document
    - project-profile
    - task-archive
    - target-owned-preserved

vnext_bundle:
  manifest_file: vnext-bundle.json
  schema_version: 1
  kind: workflow-vnext-bundle
  status: validated
  legacy_compatibility: absent
  required_categories:
    - protocol
    - schema
    - skill
  required_daily_entries:
    - prepare-task
    - review-draft
    - review-change
    - execute-step
    - debug-task
    - task-lifecycle
    - capture-work-item
    - close-task
  required_administrative_entries:
    - bootstrap-project
  required_expert_entries:
    - validate-change
    - git-commit
  phase2_runtime:
    required_when_source_phase: Phase 2
    canonical_current_task_requires_runtime_state: true
    distribution:
      kind: project-local-node
      package_path: .workflow-system/runtime
      entrypoint: .workflow-system/runtime/dist/cli.js
      dependency_install: npm-ci-omit-dev
      dependency_scope: runtime-package-local-only
      node_min_version: ">=20.0.0"
      version_binding: package-lock-and-entrypoint-checksum
    bound_operations:
      - task-state-transaction
      - finding-queue-transaction
      - lifecycle-transaction
    required_artifacts:
      - target_path: .workflow-system/runtime/dist/cli.js
        category: runtime
      - target_path: .workflow-system/runtime/package.json
        category: runtime
      - target_path: .workflow-system/runtime/package-lock.json
        category: runtime
      - target_path: .workflow-system/runtime/src/cli.ts
        category: runtime
      - target_path: .workflow-system/runtime/src/current-task.ts
        category: runtime
      - target_path: .workflow-system/runtime/src/task-state-transaction.ts
        category: runtime
      - target_path: .workflow-system/runtime/src/finding-queue-transaction.ts
        category: runtime
      - target_path: .workflow-system/runtime/src/kernel.ts
        category: runtime
      - target_path: .workflow-system/runtime/src/runtime-io.ts
        category: runtime
      - target_path: .workflow-system/runtime/src/task-identity.ts
        category: runtime
      - target_path: .workflow-system/vnext/RUNTIME_CONTRACT.yaml
        category: protocol
  source_binding:
    - root_identity
    - revision
    - tree_hash

installation:
  mode: vnext-distribution-migration
  distribution_state: vnext
  canonical_skill_surface: .agents/skills/<skill-name>/SKILL.md
  all_or_nothing: true
  install_state: .workflow-system/vnext/INSTALL_STATE.json
  receipt: .workflow-system/vnext/MIGRATION_RECEIPT.json
  receipt_version: 3
  supported_receipt_versions: [1, 2, 3]
  aligned_originals: [path, sha256, backup_path]
  in_progress_marker: .workflow-system/vnext/MIGRATION_IN_PROGRESS.json
  interruption_boundary: fail-closed-marker-requires-explicit-recovery
  no_legacy_surface: true
  replay: exact-pack-and-target-identity-no-op
  runtime_distribution:
    recorded_in:
      - .workflow-system/vnext/INSTALL_STATE.json
      - .workflow-system/vnext/MIGRATION_RECEIPT.json
    identity_fields:
      - kind
      - package_path
      - entrypoint
      - package_version
      - node_min_version
      - package_lock_sha256
      - entrypoint_sha256
  runtime_promotion:
    stage_dependencies_before_marker: true
    self_check_before_promote: true
    atomic_directory_replace: .workflow-system/runtime/node_modules
    rollback_includes_runtime_directory: true

public_decision_discovery:
  command: migrate --root <project> --json --dry-run
  output: migration_target
  fields: [target_root, target_identity]
  available_when: legacy profile identity resolves, including admission rejection
  authority: read-only binding data, not completion or migration approval
freeze_header_markers:
  scan: first 20 lines
  explicit_tag: case-insensitive "@frozen" with word boundary
  banner: case-sensitive uppercase "DO NOT MODIFY" with word boundaries
  ordinary_instruction: mixed-case "Do not modify business code" is not a freeze marker
  registry: existing registry rules remain enforced

v3_windows_markdown_links:
  classification: external
  scope: drive-absolute Markdown destinations, including backslashes and angle-wrapped spaces
  representation: original raw value, adjusted false
  access: index-only; never dereferenced or used as artifact destinations
  safety: control characters and parent traversal remain rejected; v1/v2 unchanged
