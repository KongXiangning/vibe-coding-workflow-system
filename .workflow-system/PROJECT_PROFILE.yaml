schema_version: 1

project:
  name: vibe-coding-workflow-system
  slug: vibe-coding-workflow-system
  type: ai-engineering-workflow
  summary: >
    Standalone Vibe Coding workflow-system source repository for governance
    protocols, templates, generators, runtime install/sync tooling, and
    source-repo reference renders.
  primary_hosts:
    - claude
    - codex
    - factory

runtime:
  languages:
    - TypeScript
    - Markdown
  package_manager: bun
  module_system: esm
  build_commands:
    - bun run gen:all
  test_commands:
    - bun run test:workflow-all
    - bun run validate:protocol
    - bun run validate:freshness
  dev_commands:
    - bun run workflow:health
    - bun run workflow:manifest --json
    - bun run workflow:pack

paths:
  workflow_home: docs/workflow
  source_directories:
    - scripts
    - test
  # Repo-level pattern grammar: documentation inventory uses explicit paths and limited glob support.
  documentation_files:
    - README.md
    - AGENTS.md
    - CLAUDE.md
    - docs/workflow/*.md
    - docs/workflow/generated/workflow-docs/*.md
    - vibe-coding/README.md
    - vibe-coding/vibe-coding-workflow.md
    - vibe-coding/vibe-coding-methodology.md
    - vibe-coding/vibe-coding-quality-system.md
  workflow_template_directories:
    - templates/skills
    - templates/docs
  # Repo-level pattern grammar: explicit paths plus limited glob support (`*`, `**`).
  existing_skill_template_patterns:
    - "*/SKILL.md.tmpl"
    - "SKILL.md.tmpl"
  # Repo-level pattern grammar: used for generated artifact discovery, not workflow writes.
  generated_artifacts:
    - "**/SKILL.md"
    - docs/workflow/SKILL_REGISTRY.md
    - docs/workflow/generated/workflow-docs/**
    - docs/workflow/generated/workflow-skills/**
    - dist/workflow-system/**

boundaries:
  # Workflow restricted grammar: these values feed `{{FORBIDDEN_PATHS}}` in workflow templates.
  forbidden_paths:
    - .git/**
    - node_modules/**
    - dist/**
  # Repo-level pattern grammar: generated file ownership/discovery rules.
  generated_only_paths:
    - "**/SKILL.md"
    - docs/workflow/SKILL_REGISTRY.md
    - docs/workflow/generated/workflow-docs/**
    - docs/workflow/generated/workflow-skills/**
    - dist/workflow-system/**
  workflow_owned_paths:
    - .workflow-system/PROJECT_PROFILE.yaml
    - .workflow-system/WORKFLOW_PROTOCOL.md
    - .workflow-system/FILE_SCHEMAS.md
    - docs/workflow/**
    - templates/docs/**
    - templates/skills/**
    - scripts/**
    - test/**
  human_review_required:
    - README.md
    - AGENTS.md
    - CLAUDE.md
    - vibe-coding/README.md
    - vibe-coding/vibe-coding-workflow.md
    - vibe-coding/vibe-coding-methodology.md
    - vibe-coding/vibe-coding-quality-system.md

architecture_rules:
  - Keep workflow-system automation and generators in scripts/.
  - Treat templates/skills/ as workflow skill template sources, not runtime outputs.
  - Treat templates/docs/ as workflow governance doc template sources.
  - Do not hand-edit generated reference outputs under docs/workflow/generated/** or docs/workflow/SKILL_REGISTRY.md.
  - Keep gstack references as methodology or historical comparison material unless a task explicitly targets gstack integration.
  - Prefer Bun/TypeScript for generation, validation, packaging, and runtime sync tooling.

decision_types:
  - mechanical
  - taste
  - user_challenge

governance:
  current_documents:
    - .workflow-system/PROJECT_PROFILE.yaml
    - .workflow-system/WORKFLOW_PROTOCOL.md
    - .workflow-system/FILE_SCHEMAS.md
    - AGENTS.md
    - CLAUDE.md
    - README.md
    - docs/workflow/*.md
    - docs/workflow/generated/workflow-docs/*.md
    - vibe-coding/README.md
    - vibe-coding/vibe-coding-workflow.md
    - vibe-coding/vibe-coding-methodology.md
    - vibe-coding/vibe-coding-quality-system.md
    - templates/docs/*.md.tmpl
    - templates/skills/*.SKILL.md.tmpl
  planned_documents: []

validation:
  preferred_checks:
    - bun run test:workflow-all
    - bun run validate:protocol
    - bun run validate:freshness
  required_for_generator_work:
    - handoff graph closes
    - reads/writes boundaries are non-conflicting
    - all workflow stages are covered
  # Validation matrix per .workflow-system/WORKFLOW_PROTOCOL.md §16.4.
  # Protocol-level entrypoints are defined by the workflow-system.
  # Project-level entrypoints are declared as slots and bound by the target project during Adoption A4.
  matrix:
    # --- Protocol-level: blocks-generator ---
    - name: workflow-skills-validation
      layer: protocol
      command: bun run gen:workflow-skills --dry-run
      blocker_level: blocks-generator
      description: Validate workflow skill templates, metadata, path boundaries, and handoff closure.
      phase: P9
      owner: workflow-system
    - name: workflow-docs-validation
      layer: protocol
      command: bun run gen:workflow-docs --dry-run
      blocker_level: blocks-generator
      description: Validate generated governance doc structure, required headings, and placeholder handling.
      phase: P9
      owner: workflow-system
    - name: registry-validation
      layer: protocol
      command: bun run gen:registry --dry-run
      blocker_level: blocks-generator
      description: Validate registry generation against the shared workflow metadata baseline.
      phase: P9
      owner: workflow-system
    # --- Protocol-level: blocks-merge ---
    - name: workflow-skills-tests
      layer: protocol
      command: bun run test:workflow-skills
      blocker_level: blocks-merge
      description: Run workflow skill generator tests.
      phase: P9
      owner: workflow-system
    - name: workflow-docs-tests
      layer: protocol
      command: bun run test:workflow-docs
      blocker_level: blocks-merge
      description: Run workflow docs generator tests.
      phase: P9
      owner: workflow-system
    - name: registry-tests
      layer: protocol
      command: bun run test:registry
      blocker_level: blocks-merge
      description: Run registry generator tests.
      phase: P9
      owner: workflow-system
    - name: bootstrap-tests
      layer: protocol
      command: bun run test:bootstrap-governance
      blocker_level: blocks-merge
      description: Run bootstrap planning capability tests.
      phase: P9
      owner: workflow-system
    - name: task-identity-tests
      layer: protocol
      command: bun run test:task-identity
      blocker_level: blocks-merge
      description: Run task identity contract tests.
      phase: P9
      owner: workflow-system
    # --- Project-level: unbound slots for Adoption A4 ---
    - name: unit
      layer: project
      command: ""
      blocker_level: blocks-merge
      description: Bind the target project unit-test command or runner during Adoption A4.
      phase: A4
      owner: target-project
    - name: integration
      layer: project
      command: ""
      blocker_level: blocks-merge
      description: Bind the target project integration-test command or runner during Adoption A4.
      phase: A4
      owner: target-project
    - name: e2e-smoke
      layer: project
      command: ""
      blocker_level: blocks-merge
      description: Bind the target project smoke or end-to-end validation command during Adoption A4.
      phase: A4
      owner: target-project
    - name: contract-compatibility
      layer: project
      command: ""
      blocker_level: blocks-merge
      description: Bind target-project contract compatibility checks during Adoption A4.
      phase: A4
      owner: target-project
