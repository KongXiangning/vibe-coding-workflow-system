schema_version: 1
status: shadow

public_entries:
  - id: bootstrap-project
    exposure: public
    status: shadow
    installable: false
    modes:
      - id: design
        covers_stages: [init]
        capabilities: [source-authority-policy, design-evidence-gate, scope-guard]
        runtime_operations: []
        mutation: semantic-proposal
        terminal_behavior: manual-decision
        authority_boundary: { protocol: define, model: propose, user: approve, runtime: none }
        automatic_handoff: not-applicable
      - id: greenfield
        covers_stages: [init]
        capabilities: [source-authority-policy, design-evidence-gate, scope-guard]
        runtime_operations: []
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: propose, user: confirm, runtime: none }
        automatic_handoff: "prepare-task:create"
      - id: inventory
        covers_stages: [init]
        capabilities: [source-authority-policy, propagation-evidence-validator, scope-guard]
        runtime_operations: []
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: none, runtime: none }
        automatic_handoff: "bootstrap-project:adopt"
      - id: adopt
        covers_stages: [init]
        capabilities: [source-authority-policy, propagation-evidence-validator, decision-authority-gate]
        runtime_operations: []
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: confirm, runtime: none }
        automatic_handoff: "prepare-task:create"
      - id: realign
        covers_stages: [init]
        capabilities: [source-authority-policy, host-isolation-guard, scope-guard, dangerous-operation-gate]
        runtime_operations: []
        mutation: semantic-proposal
        terminal_behavior: manual-decision
        authority_boundary: { protocol: validate, model: classify, user: approve, runtime: none }
        automatic_handoff: not-applicable

  - id: prepare-task
    exposure: public
    status: shadow
    installable: false
    modes:
      - id: create
        covers_stages: [phase-1-intake]
        capabilities: [source-authority-policy, scope-guard, decision-authority-gate, task-identity-guard, design-evidence-gate, release-evidence-gate]
        runtime_operations: [task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: define, model: propose, user: confirm, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:review"
      - id: review
        covers_stages: [phase-1-intake]
        capabilities: [source-authority-policy, scope-guard, decision-authority-gate, task-identity-guard, resume-review-gate]
        runtime_operations: [task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: confirm, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:scope-lock"
      - id: scope-lock
        covers_stages: [phase-2-scope-lock]
        capabilities: [scope-guard, dangerous-operation-gate, propagation-evidence-validator]
        runtime_operations: [task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: confirm, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:classify"
      - id: classify
        covers_stages: [phase-3-decomposition]
        capabilities: [decision-authority-gate, source-authority-policy]
        runtime_operations: [task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: define, model: classify, user: confirm, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:plan"
      - id: plan
        covers_stages: [phase-3-decomposition]
        capabilities: [decision-authority-gate, propagation-evidence-validator, external-documentation-gate, adaptive-depth-policy]
        runtime_operations: [task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: propose, user: confirm, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:decompose"
      - id: decompose
        covers_stages: [phase-3-decomposition]
        capabilities: [scope-guard, decision-authority-gate, adaptive-depth-policy]
        runtime_operations: [task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: propose, user: confirm, runtime: validate-and-commit }
        automatic_handoff: "execute-step:implement"
      - id: replan
        covers_stages: [phase-1-intake, phase-2-scope-lock, phase-3-decomposition]
        capabilities: [source-authority-policy, scope-guard, decision-authority-gate, propagation-evidence-validator]
        runtime_operations: [task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: propose, user: approve, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:review"
      - id: orchestrate
        covers_stages: [phase-1-intake, phase-2-scope-lock, phase-3-decomposition]
        capabilities: [orchestration-route-resolver, source-authority-policy, scope-guard, decision-authority-gate]
        runtime_operations: []
        mutation: none
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: confirm, runtime: none }
        automatic_handoff: "prepare-task:review"

  - id: execute-step
    exposure: public
    status: shadow
    installable: false
    modes:
      - id: orchestrate
        covers_stages: [phase-4-implementation]
        capabilities: [orchestration-route-resolver, scope-guard, diff-target-resolver]
        runtime_operations: []
        mutation: none
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: confirm, runtime: none }
        automatic_handoff: "execute-step:implement"
      - id: implement
        covers_stages: [phase-4-implementation]
        capabilities: [scope-guard, dangerous-operation-gate, decision-authority-gate, design-evidence-gate, external-documentation-gate]
        runtime_operations: [task-state-transaction]
        mutation: code
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: propose, user: confirm, runtime: validate-and-commit }
        automatic_handoff: "review-change:scope"
      - id: repair
        covers_stages: [phase-4-implementation]
        capabilities: [scope-guard, dangerous-operation-gate, finding-admission, decision-authority-gate, external-documentation-gate]
        runtime_operations: [task-state-transaction, finding-queue-transaction]
        mutation: code
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: propose, user: confirm, runtime: validate-and-commit }
        automatic_handoff: "review-change:scope"

  - id: review-change
    exposure: public
    status: shadow
    installable: false
    modes:
      - id: scope
        covers_stages: [phase-5-scope-review]
        capabilities: [read-only-review-guard, diff-target-resolver, scope-guard, propagation-evidence-validator, finding-admission]
        runtime_operations: []
        mutation: none
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: none, runtime: none }
        automatic_handoff: "review-change:implementation"
      - id: implementation
        covers_stages: [phase-5-scope-review]
        capabilities: [read-only-review-guard, diff-target-resolver, finding-admission, external-documentation-gate]
        runtime_operations: []
        mutation: none
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: none, runtime: none }
        automatic_handoff: "review-change:contract"
      - id: contract
        covers_stages: [phase-5-scope-review]
        capabilities: [read-only-review-guard, diff-target-resolver, source-authority-policy, propagation-evidence-validator, decision-authority-gate]
        runtime_operations: []
        mutation: none
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: confirm, runtime: none }
        automatic_handoff: "validate-change:regression"
      - id: report-only
        covers_stages: [phase-5-scope-review, phase-6-regression]
        capabilities: [read-only-review-guard, diff-target-resolver, validation-layer-gate, propagation-evidence-validator]
        runtime_operations: []
        mutation: none
        terminal_behavior: report-only
        authority_boundary: { protocol: validate, model: classify, user: none, runtime: none }
        automatic_handoff: not-applicable

  - id: validate-change
    exposure: public
    status: shadow
    installable: false
    modes:
      - id: regression
        covers_stages: [phase-6-regression]
        capabilities: [validation-layer-gate, diff-target-resolver, owner-route-resolver, release-evidence-gate]
        runtime_operations: []
        mutation: none
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: none, runtime: none }
        automatic_handoff: "sync-state:task"
      - id: report-only
        covers_stages: [phase-6-regression]
        capabilities: [validation-layer-gate, diff-target-resolver, read-only-review-guard]
        runtime_operations: []
        mutation: none
        terminal_behavior: report-only
        authority_boundary: { protocol: validate, model: classify, user: none, runtime: none }
        automatic_handoff: not-applicable

  - id: debug-task
    exposure: public
    status: shadow
    installable: false
    modes:
      - id: orchestrate
        covers_stages: [phase-4-6-exception]
        capabilities: [orchestration-route-resolver, root-cause-loop, owner-route-resolver, scope-guard]
        runtime_operations: []
        mutation: none
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: confirm, runtime: none }
        automatic_handoff: "debug-task:investigate"
      - id: investigate
        covers_stages: [phase-4-6-exception]
        capabilities: [root-cause-loop, owner-route-resolver, source-authority-policy, external-documentation-gate]
        runtime_operations: [task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: none, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:plan"
      - id: repair
        covers_stages: [phase-4-6-exception]
        capabilities: [root-cause-loop, owner-route-resolver, scope-guard, decision-authority-gate]
        runtime_operations: []
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: propose, user: confirm, runtime: none }
        automatic_handoff: "execute-step:repair"

  - id: task-lifecycle
    exposure: public
    status: shadow
    installable: false
    modes:
      - id: pause
        covers_stages: [phase-7-sync]
        capabilities: [lifecycle-transition-guard, task-identity-guard, scope-guard]
        runtime_operations: [lifecycle-transaction]
        mutation: semantic-proposal
        terminal_behavior: manual-decision
        authority_boundary: { protocol: define, model: propose, user: approve, runtime: validate-and-commit }
        automatic_handoff: not-applicable
      - id: interrupt
        covers_stages: [phase-7-sync]
        capabilities: [lifecycle-transition-guard, task-identity-guard, scope-guard]
        runtime_operations: [lifecycle-transaction]
        mutation: semantic-proposal
        terminal_behavior: manual-decision
        authority_boundary: { protocol: define, model: propose, user: approve, runtime: validate-and-commit }
        automatic_handoff: not-applicable
      - id: resume-paused
        covers_stages: [phase-7-sync]
        capabilities: [lifecycle-transition-guard, task-identity-guard, resume-review-gate, owner-route-resolver]
        runtime_operations: [lifecycle-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: define, model: classify, user: confirm, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:review"
      - id: resume-interrupted
        covers_stages: [phase-7-sync]
        capabilities: [lifecycle-transition-guard, task-identity-guard, resume-review-gate, owner-route-resolver]
        runtime_operations: [lifecycle-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: define, model: classify, user: confirm, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:review"
      - id: supersede
        covers_stages: [phase-7-sync, phase-1-intake]
        capabilities: [lifecycle-transition-guard, task-identity-guard, decision-authority-gate, propagation-evidence-validator]
        runtime_operations: [lifecycle-transaction, task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: define, model: classify, user: approve, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:create"
      - id: replan
        covers_stages: [phase-7-sync, phase-3-decomposition]
        capabilities: [lifecycle-transition-guard, task-identity-guard, decision-authority-gate]
        runtime_operations: [lifecycle-transaction, task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: continue
        authority_boundary: { protocol: define, model: classify, user: approve, runtime: validate-and-commit }
        automatic_handoff: "prepare-task:review"

  - id: capture-work-item
    exposure: public
    status: shadow
    installable: false
    modes:
      - id: capture-only
        covers_stages: [phase-1-intake]
        capabilities: [record-only-intake-guard, owner-route-resolver, scope-guard]
        runtime_operations: [inbox-record-transaction]
        mutation: task-artifact
        terminal_behavior: manual-decision
        authority_boundary: { protocol: define, model: classify, user: confirm, runtime: validate-and-commit }
        automatic_handoff: not-applicable

  - id: sync-state
    exposure: public
    status: shadow
    installable: false
    modes:
      - id: task
        covers_stages: [phase-7-sync]
        capabilities: [source-authority-policy, scope-guard]
        runtime_operations: [task-state-transaction]
        mutation: semantic-proposal
        terminal_behavior: complete
        authority_boundary: { protocol: validate, model: propose, user: none, runtime: validate-and-commit }
        automatic_handoff: not-applicable
      - id: status
        covers_stages: [phase-7-sync]
        capabilities: [source-authority-policy, release-evidence-gate]
        runtime_operations: [project-status-transaction]
        mutation: semantic-proposal
        terminal_behavior: complete
        authority_boundary: { protocol: validate, model: propose, user: none, runtime: validate-and-commit }
        automatic_handoff: not-applicable
      - id: contracts
        covers_stages: [phase-7-sync]
        capabilities: [source-authority-policy, decision-authority-gate, propagation-evidence-validator]
        runtime_operations: [contract-candidate-commit]
        mutation: semantic-proposal
        terminal_behavior: complete
        authority_boundary: { protocol: define, model: classify, user: approve, runtime: validate-and-commit }
        automatic_handoff: not-applicable
      - id: decisions
        covers_stages: [phase-7-sync]
        capabilities: [source-authority-policy, decision-authority-gate]
        runtime_operations: [decision-record-transaction]
        mutation: semantic-proposal
        terminal_behavior: complete
        authority_boundary: { protocol: validate, model: classify, user: confirm, runtime: validate-and-commit }
        automatic_handoff: not-applicable
      - id: host-guidance
        covers_stages: [phase-7-sync]
        capabilities: [source-authority-policy, host-isolation-guard, decision-authority-gate]
        runtime_operations: [paired-host-guidance-transaction]
        mutation: semantic-proposal
        terminal_behavior: complete
        authority_boundary: { protocol: validate, model: classify, user: confirm, runtime: validate-and-commit }
        automatic_handoff: not-applicable
      - id: findings
        covers_stages: [phase-5-scope-review, phase-7-sync]
        capabilities: [finding-admission, owner-route-resolver, scope-guard]
        runtime_operations: [finding-queue-transaction]
        mutation: semantic-proposal
        terminal_behavior: complete
        authority_boundary: { protocol: validate, model: classify, user: none, runtime: validate-and-commit }
        automatic_handoff: not-applicable
      - id: lessons
        covers_stages: [phase-7-sync, phase-8-delivery]
        capabilities: [source-authority-policy, closure-eligibility-gate]
        runtime_operations: [lesson-record-transaction]
        mutation: semantic-proposal
        terminal_behavior: complete
        authority_boundary: { protocol: validate, model: classify, user: none, runtime: validate-and-commit }
        automatic_handoff: not-applicable

  - id: close-task
    exposure: public
    status: shadow
    installable: false
    modes:
      - id: close
        covers_stages: [phase-8-delivery]
        capabilities: [closure-eligibility-gate, source-authority-policy, release-evidence-gate, orchestration-route-resolver]
        runtime_operations: []
        mutation: none
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: classify, user: confirm, runtime: none }
        automatic_handoff: "close-task:summary"
      - id: summary
        covers_stages: [phase-8-delivery]
        capabilities: [closure-eligibility-gate, release-evidence-gate]
        runtime_operations: []
        mutation: none
        terminal_behavior: continue
        authority_boundary: { protocol: validate, model: propose, user: none, runtime: none }
        automatic_handoff: "close-task:archive"
      - id: archive
        covers_stages: [phase-8-delivery]
        capabilities: [closure-eligibility-gate, task-identity-guard, source-authority-policy]
        runtime_operations: [archive-transaction]
        mutation: semantic-proposal
        terminal_behavior: complete
        authority_boundary: { protocol: define, model: propose, user: confirm, runtime: validate-and-commit }
        automatic_handoff: not-applicable

internal_capabilities:
  - { id: source-authority-policy, exposure: internal, installable: false, kind: policy, authority_owner: protocol, description: "Resolve protocol/schema and project source precedence without conversational overrides." }
  - { id: scope-guard, exposure: internal, installable: false, kind: gate, authority_owner: protocol, description: "Enforce Allowed, Conditional, Forbidden, widening, and default-deny mutation scope." }
  - { id: dangerous-operation-gate, exposure: internal, installable: false, kind: gate, authority_owner: user, description: "Require target, risk, recovery, scope check, and confirmation for dangerous operations." }
  - { id: decision-authority-gate, exposure: internal, installable: false, kind: gate, authority_owner: user, description: "Separate mechanical choices from taste and user-challenge authority." }
  - { id: propagation-evidence-validator, exposure: internal, installable: false, kind: validator, authority_owner: protocol, description: "Validate discovery union, compatibility, migration, and linked-regression evidence." }
  - { id: diff-target-resolver, exposure: internal, installable: false, kind: resolver, authority_owner: protocol, description: "Resolve one explicit diff target shared by review and validation." }
  - { id: read-only-review-guard, exposure: internal, installable: false, kind: gate, authority_owner: protocol, description: "Prevent review and report-only paths from mutating code or governance state." }
  - { id: finding-admission, exposure: internal, installable: false, kind: gate, authority_owner: protocol, description: "Admit only current-owner in-scope mechanical findings before repair." }
  - { id: owner-route-resolver, exposure: internal, installable: false, kind: router, authority_owner: model, description: "Separate canonical ownership from guard-aware executable handoff." }
  - { id: lifecycle-transition-guard, exposure: internal, installable: false, kind: validator, authority_owner: protocol, description: "Validate legal lifecycle tuples, transitions, markers, and fail-closed recovery." }
  - { id: resume-review-gate, exposure: internal, installable: false, kind: gate, authority_owner: protocol, description: "Require explicit package, complete recovery evidence, normalized reasons, and review before execution." }
  - { id: record-only-intake-guard, exposure: internal, installable: false, kind: gate, authority_owner: protocol, description: "Keep unrelated inbox capture separate from task creation, lifecycle, and task identity." }
  - { id: validation-layer-gate, exposure: internal, installable: false, kind: validator, authority_owner: protocol, description: "Keep protocol validation separate from target-project and task-level QA." }
  - { id: generation-atomicity-policy, exposure: internal, installable: false, kind: policy, authority_owner: protocol, description: "Preserve render/validate-before-write and generated/live direction." }
  - { id: host-isolation-guard, exposure: internal, installable: false, kind: gate, authority_owner: protocol, description: "Protect source/target separation and isolated workflow-system host assets." }
  - { id: design-evidence-gate, exposure: internal, installable: false, kind: gate, authority_owner: user, description: "Require auditable design source and acceptance before UI implementation." }
  - { id: release-evidence-gate, exposure: internal, installable: false, kind: gate, authority_owner: protocol, description: "Prevent stable or complete claims without required release, canary, benchmark, or rollback evidence." }
  - { id: external-documentation-gate, exposure: internal, installable: false, kind: gate, authority_owner: protocol, description: "Require current third-party documentation when external behavior affects correctness." }
  - { id: task-identity-guard, exposure: internal, installable: false, kind: validator, authority_owner: protocol, description: "Validate immutable task identity, active ownership, and canonical artifact paths." }
  - { id: root-cause-loop, exposure: internal, installable: false, kind: gate, authority_owner: model, description: "Require reproduction and hypothesis validation before repair, with bounded non-convergence." }
  - { id: adaptive-depth-policy, exposure: internal, installable: false, kind: policy, authority_owner: protocol, description: "Allow less planning prose without bypassing hard governance gates." }
  - { id: closure-eligibility-gate, exposure: internal, installable: false, kind: gate, authority_owner: protocol, description: "Require acceptance, validation, remaining-risk, and release evidence before archive." }
  - { id: orchestration-route-resolver, exposure: internal, installable: false, kind: router, authority_owner: protocol, description: "Resolve validated next actions without replacing child authority or write boundaries." }

runtime_operations:
  - id: task-state-transaction
    exposure: runtime
    installable: false
    proposal_kind: task-state-delta
    proposal_schema_ref: runtime-proposal-envelope
    canonical_state_sources: [docs/workflow/CURRENT_TASK.md]
    write_targets: [docs/workflow/CURRENT_TASK.md]
    write_policy: exact-allowlist
    source_tuple_required: true
    authority_evidence_required: true
    conflict_key: task-id+source-revision
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed
    result_states: [success, no-op, conflict, blocked]
  - id: lifecycle-transaction
    exposure: runtime
    installable: false
    proposal_kind: lifecycle-transition-proposal
    proposal_schema_ref: runtime-proposal-envelope
    canonical_state_sources: [docs/workflow/CURRENT_TASK.md, TASKS/paused, TASKS/interrupted]
    write_targets: [docs/workflow/CURRENT_TASK.md, "TASKS/paused/**", "TASKS/interrupted/**"]
    write_policy: exact-allowlist
    source_tuple_required: true
    authority_evidence_required: true
    conflict_key: task-id+source-revision+target-state
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed
    result_states: [success, no-op, conflict, blocked]
  - id: inbox-record-transaction
    exposure: runtime
    installable: false
    proposal_kind: unrelated-work-item-proposal
    proposal_schema_ref: runtime-proposal-envelope
    canonical_state_sources: [docs/workflow/CURRENT_TASK.md, TASKS/inbox]
    write_targets: ["TASKS/inbox/**"]
    write_policy: exact-allowlist
    source_tuple_required: true
    authority_evidence_required: true
    conflict_key: content-fingerprint+active-task-id
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed
    result_states: [success, no-op, conflict, blocked]
  - id: finding-queue-transaction
    exposure: runtime
    installable: false
    proposal_kind: admitted-finding-delta
    proposal_schema_ref: runtime-proposal-envelope
    canonical_state_sources: [docs/workflow/CURRENT_TASK.md]
    write_targets: [docs/workflow/CURRENT_TASK.md]
    write_policy: exact-allowlist
    source_tuple_required: true
    authority_evidence_required: true
    conflict_key: task-id+finding-fingerprint+diff-target
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed
    result_states: [success, no-op, conflict, blocked]
  - id: project-status-transaction
    exposure: runtime
    installable: false
    proposal_kind: project-status-delta
    proposal_schema_ref: runtime-proposal-envelope
    canonical_state_sources: [docs/workflow/STATUS.md, docs/workflow/CURRENT_TASK.md]
    write_targets: [docs/workflow/STATUS.md]
    write_policy: exact-allowlist
    source_tuple_required: true
    authority_evidence_required: true
    conflict_key: task-id+source-revision
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed
    result_states: [success, no-op, conflict, blocked]
  - id: contract-candidate-commit
    exposure: runtime
    installable: false
    proposal_kind: verified-contract-candidate
    proposal_schema_ref: runtime-proposal-envelope
    canonical_state_sources: [docs/workflow/CONTRACTS.md, docs/workflow/DECISIONS.md]
    write_targets: [docs/workflow/CONTRACTS.md]
    write_policy: exact-allowlist
    source_tuple_required: true
    authority_evidence_required: true
    conflict_key: contract-key+source-revision
    atomic: true
    idempotence: fail-closed
    conflict_policy: fail-closed
    result_states: [success, no-op, conflict, blocked]
  - id: decision-record-transaction
    exposure: runtime
    installable: false
    proposal_kind: confirmed-decision-record
    proposal_schema_ref: runtime-proposal-envelope
    canonical_state_sources: [docs/workflow/DECISIONS.md, docs/workflow/CONTRACTS.md]
    write_targets: [docs/workflow/DECISIONS.md]
    write_policy: exact-allowlist
    source_tuple_required: true
    authority_evidence_required: true
    conflict_key: decision-id+source-revision
