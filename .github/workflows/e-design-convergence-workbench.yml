name: E design convergence workbench
on:
  push:
    branches: [codex/e-design-convergence-work-20260919]
    paths: [.github/workflows/e-design-convergence-workbench.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c21c8c8702ea69e7f81dfa35021bf390c8837e2f
          persist-credentials: false
      - name: Export current redacted source tree only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c21c8c8702ea69e7f81dfa35021bf390c8837e2f
          git archive HEAD | gzip > "$RUNNER_TEMP/e-design-source.tgz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e-design-source
          path: ${{ runner.temp }}/e-design-source.tgz
          retention-days: 1
          if-no-files-found: error
