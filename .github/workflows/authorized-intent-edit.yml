name: One-shot authorized-intent source edit

on:
  push:
    branches: [codex/evidence-plan-amendment-vnext]
    paths:
      - .github/workflows/authorized-intent-edit.yml
      - .github/authorized-intent.patch

permissions:
  contents: write

concurrency:
  group: authorized-intent-source-edit
  cancel-in-progress: false

jobs:
  source-edit:
    if: github.ref == 'refs/heads/codex/evidence-plan-amendment-vnext'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Export source for the authorized edit
        if: hashFiles('.github/authorized-intent.patch') == ''
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/authorized-intent-source.tar"
      - uses: actions/upload-artifact@v4
        if: hashFiles('.github/authorized-intent.patch') == ''
        with:
          name: authorized-intent-source
          path: ${{ runner.temp }}/authorized-intent-source.tar
          retention-days: 1
      - name: Apply the exact source patch and remove this one-shot transport
        if: hashFiles('.github/authorized-intent.patch') != ''
        run: |
          set -euo pipefail
          git apply --index .github/authorized-intent.patch
          git rm .github/authorized-intent.patch .github/workflows/authorized-intent-edit.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(vnext): honor authorized intent without manufacturing completion'
          git push origin HEAD:refs/heads/codex/evidence-plan-amendment-vnext
