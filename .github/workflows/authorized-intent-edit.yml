name: One-shot authorized-intent source edit

on:
  push:
    branches: [codex/evidence-plan-amendment-vnext]
    paths:
      - .github/authorized-intent.patch

permissions:
  contents: write

concurrency:
  group: authorized-intent-source-edit
  cancel-in-progress: false

jobs:
  source-edit:
    if: github.ref == 'refs/heads/codex/evidence-plan-amendment-vnext'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact authorized source change (no tests, build or release)
        run: |
          set -euo pipefail
          git fetch --depth=1 origin c1caf5914cb43766584f361405117c7db0116ab0
          git diff --quiet c1caf5914cb43766584f361405117c7db0116ab0 -- . ':(exclude).github/**'
          cat .github/authorized-intent.patch.1 .github/authorized-intent.patch.2 | base64 -d | xz -d > "$RUNNER_TEMP/authorized-intent.patch"
          echo "d8226cbeb2c663c61e5c47d902cbe73274e2e840571cdca2d4c1fba6dcddae0b  $RUNNER_TEMP/authorized-intent.patch" | sha256sum -c -
          git apply --unidiff-zero --index "$RUNNER_TEMP/authorized-intent.patch"
          git rm .github/authorized-intent.patch .github/authorized-intent.patch.1 .github/authorized-intent.patch.2 .github/workflows/authorized-intent-edit.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(vnext): separate authorized intent, execution facts and completion'
          git push origin HEAD:refs/heads/codex/evidence-plan-amendment-vnext
