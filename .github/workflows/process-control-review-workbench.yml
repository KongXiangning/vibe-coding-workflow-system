name: Process-control review focused verification
on:
  push:
    branches: [codex/process-control-review-work-20260918]
    paths: [.github/workflows/process-control-review-workbench.yml]
permissions:
  contents: read
concurrency:
  group: process-control-review-20260918
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: write
    env:
      BASE_SHA: 96ada7cf86fe6ea275b8d5e349d52ad1434d9cdb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Apply verified source-only patch to exact baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-logs"
          cp .process-control-review/manifest.json "$RUNNER_TEMP/review-manifest.json"
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          encoded = pathlib.Path('.process-control-review/fixes.b64').read_text().strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a3bb5982e9bf941352c0ef81abb09a6ccaadb62d36d7a3a95c8190059f4fb338'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'review-fixes.patch').write_bytes(patch)
          print('Verified reviewed source patch:', len(patch), 'bytes')
          PY
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --unidiff-zero --check "$RUNNER_TEMP/review-fixes.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/review-fixes.patch"
          bun install --frozen-lockfile --ignore-scripts
      - name: Rebuild Runtime and verify source contracts and freshness
        shell: bash
        run: |
          set -euo pipefail
          { bun --version; node --version; bun run validate:vnext-runtime; bun run validate:vnext-source; bun run gen:all; bun run validate:freshness; } 2>&1 | tee "$RUNNER_TEMP/review-logs/contracts.log"
      - name: Three review regressions and existing process-control behavior
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 60000 test/vnext-runtime.test.ts --test-name-pattern 'process-control' 2>&1 | tee "$RUNNER_TEMP/review-logs/process.log"
      - name: Related evidence identity, confirmation and retry protections
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 60000 test/vnext-runtime.test.ts --test-name-pattern 'shared minimum-sufficient validation matrix|validation contract enforces replacement selection|S2 rule success|S2 static evidence|runs the ordinary draft|enforces confirmation authority|Task Basis retains|provides a canonical claim-evidence migration|does not let step-progress replace|close-task derives validation truth|S4 retries' 2>&1 | tee "$RUNNER_TEMP/review-logs/protections.log"
      - name: Directly related Skill contracts
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 60000 test/workflow-vnext-source.test.ts --test-name-pattern 'preserves P-12|keeps execute-step focused|requires prepare-task to map' 2>&1 | tee "$RUNNER_TEMP/review-logs/skills.log"
      - name: Verify exact final tree and publish isolated clean candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          expected = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'review-manifest.json').read_text())
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == set(expected), (changed - set(expected), set(expected) - changed)
          for path, sha in expected.items():
              actual = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              assert actual == sha, (path, actual, sha)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          print('All 11 final source/generated files match the tested bytes.')
          PY
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- VERSION package.json .github .process-control-review)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n\n%s\n' 'fix(vnext): preserve validation ownership and retry exact successors' 'Keep engineering replacements selection-identical, bind waiver labels to exclusive frozen obligations at recording and consumption, and adopt exact successor prerequisites and initial aggregate after publication exceptions. Preserve existing fail-closed governance-lock handling. Built and verified with targeted Runtime, compiled Node CLI, and Skill contract regressions.' | git commit-tree "$tree" -p "$BASE_SHA")
          branch="codex/process-control-review-verified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "$commit:refs/heads/$branch"
          printf 'BASE_SHA=%s\nTREE_SHA=%s\nCOMMIT_SHA=%s\nBRANCH=%s\n' "$BASE_SHA" "$tree" "$commit" "$branch" | tee "$RUNNER_TEMP/review-logs/candidate.txt"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$commit" -f state=success -f context=process-control/review-fixes -f description='Three review fixes and related focused Runtime/Node CLI/Skill checks passed' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '## Verified review-fix candidate\n\n`%s`\n\nBase `%s`. Product branch unchanged by this workflow.\n' "$commit" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: process-control-review-verification
          path: ${{ runner.temp }}/review-logs/
          retention-days: 3
          if-no-files-found: warn
