name: Workflow System CI
on: [push, pull_request]

jobs:
  protocol-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Run protocol-level validation
        run: bun run validate:protocol
      - name: Run workflow-system freshness gates
        run: bun run validate:freshness
      - name: Run workflow-system test suite
        run: bun run test:workflow-all
