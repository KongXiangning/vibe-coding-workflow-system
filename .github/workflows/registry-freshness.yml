name: Workflow Registry Freshness
on: [push, pull_request]
jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Generate workflow registry
        run: bun run gen:registry
      - name: Verify workflow registry is fresh
        run: |
          git diff --exit-code -- SKILL_REGISTRY.md || {
            echo "SKILL_REGISTRY.md is stale. Run: bun run gen:registry"
            exit 1
          }
