name: B migration receipts workbench
on:
  push:
    branches: [codex/b-migration-receipts-work-20260919]
    paths: [.github/workflows/b-migration-receipts-workbench.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: afeec7b8f7eed0cbf9c11dd74544582acb78c25f
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Export exact source and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = afeec7b8f7eed0cbf9c11dd74544582acb78c25f
          bun install --frozen-lockfile --ignore-scripts
          target="$RUNNER_TEMP/b-receipt-fix"
          mkdir -p "$target/source" "$target/tools"
          git archive HEAD | tar -x -C "$target/source"
          cp -a node_modules "$target/source/node_modules"
          cp "$(command -v bun)" "$target/tools/bun"
          git rev-parse HEAD > "$target/source-revision.txt"
          tar -czf "$RUNNER_TEMP/b-receipt-fix.tgz" -C "$RUNNER_TEMP" b-receipt-fix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b-receipt-fix-source
          path: ${{ runner.temp }}/b-receipt-fix.tgz
          retention-days: 1
          if-no-files-found: error
