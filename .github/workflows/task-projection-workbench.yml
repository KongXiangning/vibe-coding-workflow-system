name: Task projection protocol finalization
on:
  push:
    branches: [codex/task-projection-work-20260918]
    paths: [.github/workflows/task-projection-workbench.yml]
permissions:
  contents: read
concurrency:
  group: task-projection-workbench-20260918
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      statuses: write
    env:
      CODE_SHA: 4823918d7b52c4d0fd398783754ea192a8d0b8fa
      CODE_RUN: '35368400658'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Bind already-verified Runtime and exact documentation change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/projection-final-logs"
          cp .task-projection-work/protocol.patch "$RUNNER_TEMP/protocol.patch"
          test "$(sha256sum "$RUNNER_TEMP/protocol.patch" | cut -d ' ' -f1)" = d75bc6b2967e95488f4bb17e735c23d08398c58d86d4a8efbdea53ac55213f42
          gh api "repos/$GITHUB_REPOSITORY/commits/$CODE_SHA/status" > "$RUNNER_TEMP/code-status.json"
          python3 - <<'PY'
          import json, os, pathlib
          status = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'code-status.json').read_text())
          assert status['sha'] == os.environ['CODE_SHA']
          assert any(s['context'] == 'task-projection/focused-verification' and s['state'] == 'success'
              and s['target_url'].endswith('/actions/runs/' + os.environ['CODE_RUN']) for s in status['statuses'])
          PY
          git checkout --detach "$CODE_SHA"
          test "$(git rev-parse HEAD)" = "$CODE_SHA"
          git apply --check "$RUNNER_TEMP/protocol.patch"
          git apply "$RUNNER_TEMP/protocol.patch"
          bun install --frozen-lockfile --ignore-scripts
      - name: Rebuild and verify protocol, contracts and freshness
        shell: bash
        run: |
          set -euo pipefail
          { bun run validate:vnext-runtime; bun run validate:vnext-source; bun run gen:all; bun run validate:freshness; } 2>&1 | tee "$RUNNER_TEMP/projection-final-logs/contracts.log"
          bun test --timeout 60000 test/workflow-vnext-source.test.ts --test-name-pattern 'preserves P-12|keeps execute-step focused|requires prepare-task to map' 2>&1 | tee "$RUNNER_TEMP/projection-final-logs/skills.log"
      - name: Verify documentation-only delta and publish final candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          target = 'templates/vnext/bootstrap/WORKFLOW_PROTOCOL.md'
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert changed == [target], changed
          assert hashlib.sha256(pathlib.Path(target).read_bytes()).hexdigest() == '8aa1c82ea1af194b3bae2bff3e0c43b634372c3da58fd8878532c3f2f31d5236'
          subprocess.run(['git', 'add', '--', target], check=True)
          print('Runtime, tests, generated CLI and remaining contracts are byte-identical to the successful focused verification.')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n\n%s\n' 'docs(vnext): align workflow protocol with compact task presentation' 'Document the compact-v3 aggregate without altering runtime or test bytes. Reuse exact code verification from run 35368400658 and check this protocol-only delta, rebuild and freshness.' | git commit-tree "$tree" -p "$CODE_SHA")
          branch="codex/task-projection-final-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "$commit:refs/heads/$branch"
          printf 'CODE_SHA=%s\nCODE_VERIFICATION_RUN=%s\nCOMMIT_SHA=%s\nBRANCH=%s\n' "$CODE_SHA" "$CODE_RUN" "$commit" "$branch" | tee "$RUNNER_TEMP/projection-final-logs/candidate.txt"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$commit" -f state=success -f context=task-projection/focused-verification -f description='Exact tested Runtime retained; protocol-only delta, contracts and freshness passed' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '## Final compact task candidate\n\n`%s`\n\nRuntime/test bytes equal `%s`, verified by run %s. Only the workflow protocol text changed; focused source checks passed.\n' "$commit" "$CODE_SHA" "$CODE_RUN" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task-projection-protocol-verification
          path: ${{ runner.temp }}/projection-final-logs/
          retention-days: 3
          if-no-files-found: warn
