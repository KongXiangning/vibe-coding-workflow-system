name: Task metrics focused verification
on:
  push:
    branches: [codex/task-metrics-work-20260919]
    paths: [.github/workflows/task-metrics-workbench.yml]
permissions:
  contents: read
concurrency:
  group: task-metrics-workbench-20260919
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      statuses: write
    env:
      BASE_SHA: f11bbe360492d093fd4eed193f1b0c212ffedfdf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Apply exact locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metrics-logs"
          cp .task-metrics-work/manifest.json "$RUNNER_TEMP/metrics-manifest.json"
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          encoded = ''.join(pathlib.Path(f'.task-metrics-work/patch-{i}.b64').read_text().strip() for i in range(1, 3))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a441e81a142faf27389ee19d95bafa9b904ec04bf24ac70fa043c2075047e33c'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'metrics.patch').write_bytes(patch)
          print('Verified exact source patch:', len(patch), 'bytes')
          PY
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --check "$RUNNER_TEMP/metrics.patch"
          git apply "$RUNNER_TEMP/metrics.patch"
          git add -N runtime/vnext/src/task-storage-metrics.ts test/vnext-task-metrics.test.ts
          bun install --frozen-lockfile --ignore-scripts
      - name: Rebuild Runtime and verify contracts and generation
        shell: bash
        run: |
          set -euo pipefail
          { bun --version; node --version; bun run validate:vnext-runtime; bun run validate:vnext-source; bun run gen:all; bun run validate:freshness; } 2>&1 | tee "$RUNNER_TEMP/metrics-logs/contracts.log"
      - name: Read-only metrics, byte accounting and real transaction sequence
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 60000 test/vnext-task-metrics.test.ts test/vnext-runtime.test.ts --test-name-pattern 'storage metrics|committed growth|diagnostic failures' 2>&1 | tee "$RUNNER_TEMP/metrics-logs/metrics.log"
      - name: Existing receipt, durable format and process-control protections
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 60000 test/vnext-runtime.test.ts --test-name-pattern 'storage migration preserves issued|compact-v3 durable golden|process-control review waiver cannot|process-control review prepareSuccessor|process-control review rejects validation' 2>&1 | tee "$RUNNER_TEMP/metrics-logs/protections.log"
      - name: Existing committed lineage and deduplication
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 60000 test/vnext-task-store.test.ts --test-name-pattern 'receipt lineage|deduplicates unchanged objects' 2>&1 | tee "$RUNNER_TEMP/metrics-logs/store.log"
      - name: Match tested final bytes and publish isolated candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          expected = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'metrics-manifest.json').read_text())
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == set(expected), (changed - set(expected), set(expected) - changed)
          for path, sha in expected.items():
              actual = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              assert actual == sha, (path, actual, sha)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          print('All 9 final source/generated files match the locally tested bytes.')
          PY
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- VERSION package.json .github .task-metrics-work)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n\n%s\n' 'feat(vnext): report read-only task storage growth diagnostics' 'Phase C: add diagnostic-only UTF-8 logical and physical byte accounting to validate --summary, tied to adjacent committed transactions. Distinguish current projection, logical evidence, retained committed material and filesystem inventory. Report unavailable history and bounded scan failures without writes, new authority, receipts or workflow gates. Verified through focused read-only, real lifecycle and compiled Node CLI scenarios.' | git commit-tree "$tree" -p "$BASE_SHA")
          branch="codex/task-metrics-verified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "$commit:refs/heads/$branch"
          printf 'BASE_SHA=%s\nTREE_SHA=%s\nCOMMIT_SHA=%s\nBRANCH=%s\n' "$BASE_SHA" "$tree" "$commit" "$branch" | tee "$RUNNER_TEMP/metrics-logs/candidate.txt"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$commit" -f state=success -f context=task-metrics/focused-verification -f description='Read-only metrics, transaction deltas, compiled CLI and existing protections passed' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '## Verified C-stage candidate\n\n`%s`\n\nBase `%s`. Product branch unchanged by this workflow.\n' "$commit" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: task-metrics-focused-verification
          path: ${{ runner.temp }}/metrics-logs/
          retention-days: 3
          if-no-files-found: warn
