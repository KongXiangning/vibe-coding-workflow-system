name: Process-control focused verification
on:
  push:
    branches: [codex/process-control-work-20260918]
    paths: [.github/workflows/process-control-workbench.yml]
permissions:
  contents: read
concurrency:
  group: process-control-workbench-20260918
  cancel-in-progress: false
jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      statuses: write
    env:
      BASE_SHA: daf731e459115d6f051c46722f0f8bb25d9115b8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify transport and apply to exact product baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase-a-logs"
          cp .process-control-work/output-manifest.json "$RUNNER_TEMP/phase-a-manifest.json"
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib
          encoded = ''.join(pathlib.Path(f'.process-control-work/patch-{i}.b64').read_text().strip() for i in range(1, 8))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4dd609e7c0f30197b1240cd9b1b08f193345c9fa94bea7fcc9e4bd997a63a351'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'phase-a.patch').write_bytes(patch)
          print('Verified exact locally reviewed patch:', len(patch), 'bytes')
          PY
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --unidiff-zero --check "$RUNNER_TEMP/phase-a.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/phase-a.patch"
          bun install --frozen-lockfile --ignore-scripts
      - name: Build, contracts and generated freshness
        shell: bash
        run: |
          set -euo pipefail
          { bun --version; node --version; bun run validate:vnext-runtime; bun run validate:vnext-source; bun run gen:all; bun run validate:freshness; } 2>&1 | tee "$RUNNER_TEMP/phase-a-logs/contracts.log"
      - name: New process-control and compiled Node CLI scenarios
        shell: bash
        run: |
          set -euo pipefail
          # Multi-transaction CLI scenarios perform real synchronous disk writes.
          # The first hosted run finished all assertions but exceeded Bun's 5s default.
          bun test --timeout 60000 test/vnext-runtime.test.ts --test-name-pattern 'process-control' 2>&1 | tee "$RUNNER_TEMP/phase-a-logs/process.log"
      - name: Existing identity, evidence and recovery protections
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 60000 test/vnext-runtime.test.ts --test-name-pattern 'shared minimum-sufficient validation matrix|validation contract enforces replacement selection|S2 rule success|S2 consumes reproduction|S2 static evidence|a confirmed same-plan test error|same-plan recovery rejects|runs the ordinary draft|enforces confirmation authority|Task Basis retains|commits active supersede|supersede preserves the exact|cannot replay supersede|blocks an incident-shaped|provides a canonical claim-evidence migration|does not let step-progress replace|close-task derives validation truth|atomically closes active' 2>&1 | tee "$RUNNER_TEMP/phase-a-logs/core.log"
      - name: Authorized continuation and same-plan retry
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 60000 test/vnext-runtime.test.ts --test-name-pattern 'E[1-9]|scope amendment' 2>&1 | tee "$RUNNER_TEMP/phase-a-logs/authority.log"
          bun test --timeout 60000 test/vnext-runtime.test.ts --test-name-pattern 'S4 retries' 2>&1 | tee "$RUNNER_TEMP/phase-a-logs/retry.log"
      - name: Scope and source contracts
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 60000 test/vnext-mutation-scope.test.ts --test-name-pattern 'Mutation Authority v2' 2>&1 | tee "$RUNNER_TEMP/phase-a-logs/scope.log"
          bun test --timeout 60000 test/workflow-vnext-source.test.ts --test-name-pattern 'contract|template|generated|draft|evidence' 2>&1 | tee "$RUNNER_TEMP/phase-a-logs/source.log"
      - name: Fixed package installation and Node CLI behavior
        shell: bash
        run: |
          set -euo pipefail
          bun test --timeout 60000 test/vnext-runtime.test.ts --test-name-pattern 'fixed tgz installed Node CLI supports same-envelope discovery' 2>&1 | tee "$RUNNER_TEMP/phase-a-logs/installed-cli.log"
      - name: Bind final files and publish a clean verified candidate
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          expected = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'phase-a-manifest.json').read_text())
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == set(expected), (changed - set(expected), set(expected) - changed)
          for path, sha in expected.items():
              actual = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              assert actual == sha, (path, actual, sha)
          subprocess.run(['git', 'add', '--', *expected], check=True)
          print('All 24 source/generated files match the locally tested bytes.')
          PY
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- VERSION package.json .github .process-control-work)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n\n%s\n' 'feat(vnext): support explicit task decisions and bounded continuation' 'Phase A: human observations and risk decisions, explicit superseded successor, proportional same-domain review, and engineering-only validation replacement. Preserve task intent, history, failures and retry budgets. Independently rebuilt and checked with focused contract, CLI and installed-package scenarios.' | git commit-tree "$tree" -p "$BASE_SHA")
          branch="codex/process-control-verified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "$commit:refs/heads/$branch"
          printf 'BASE_SHA=%s\nTREE_SHA=%s\nCOMMIT_SHA=%s\nBRANCH=%s\n' "$BASE_SHA" "$tree" "$commit" "$branch" | tee "$RUNNER_TEMP/phase-a-logs/candidate.txt"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$commit" -f state=success -f context=process-control/focused-verification -f description='Phase-A focused tests, rebuilt Node CLI and installed package passed' -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          printf '## Verified candidate\n\n`%s`\n\nBase `%s`; no product branch was changed by this workflow.\n' "$commit" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: process-control-focused-verification
          path: ${{ runner.temp }}/phase-a-logs/
          retention-days: 3
          if-no-files-found: warn
